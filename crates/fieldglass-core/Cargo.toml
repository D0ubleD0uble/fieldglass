[package]
name        = "fieldglass-core"
description = "Shared types, grid projection and reprojection, and raster rendering for the Fieldglass weather-data readers"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["grib", "netcdf", "meteorology", "weather", "geospatial"]
categories  = ["science", "parser-implementations"]

[features]
# Viewer-domain code (`warp`, `overlay`, `colormap`) consumed only by
# `fieldglass-napi`. On by default so the workspace and downstream renderers get
# it transitively; the format crates opt out with `default-features = false` to
# keep their public API to the parsing surface. See the crate-level docs.
default = ["render", "fs", "analysis"]
render = []
# Analysis over a decoded field: `contour`, `csv`, `combine`. Host operations
# rather than viewer ones — they take values and return values, and none of
# them needs the RGBA painter — so they are their own feature and not part of
# `render`: a values-first host (the browser one, #460) wants contours without
# the painter, and #462's bundle-size gate is why `core`'s optional surfaces
# are separable at all. Nothing else in the crate reads them; the three modules
# have no `use crate::` line between them.
analysis = []
# Host-filesystem surface: `detect::detect_format`, the only thing in the four
# format crates that touches `std::fs`. Off for hosts without a filesystem —
# `wasm32-unknown-unknown` compiles `std::fs` but every call fails at runtime,
# so leaving it in would silently degrade detection to extension-guessing. Not
# a `no_std` switch: the crate still links `std` for float math.
fs = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
