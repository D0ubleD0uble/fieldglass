[package]
name        = "fieldglass-aec"
description = "CCSDS 121.0-B Adaptive Entropy Coding (AEC / szip) decoder in pure Rust, checked against libaec"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["aec", "ccsds", "szip", "grib2", "hdf5"]
categories  = ["compression", "science", "parser-implementations"]
# Published in lockstep, first in `release.yml`'s publish loop, because
# `fieldglass-grib2` pins it with `=` and cannot be packaged until it is on the
# index. The very first publish is by hand (ADR-0012 decision 10): crates.io
# Trusted Publishing can only be configured for a crate that already exists.

[dependencies]
# The one dependency (ADR-0012 decision 1). It is already in every consumer's
# tree through `fieldglass-core`, so a format crate that takes this one links
# nothing new. No workspace crate: a codec that returned `FieldglassError`
# would drag `core` into a consumer that wants only the codec.
thiserror = { workspace = true }

[dev-dependencies]
# The conformance manifest is JSON, written by tools/build_aec_fixtures.py.
serde_json = { workspace = true }
# The manifest pins every stream and every libaec output by SHA-256.
sha2 = { workspace = true }

[lints]
workspace = true
