[package]
name        = "fieldglass-grib2"
description = "GRIB edition 2 format reader — full §0–§7 parsing and simple-packing (DRS 5.0) value decode"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["grib", "grib2", "meteorology", "weather", "gis"]
categories  = ["science", "parser-implementations"]

[dependencies]
fieldglass-core = { path = "../fieldglass-core", version = "=0.4.0", default-features = false }
serde = { workspace = true }
png = { workspace = true }
rust-aec = { workspace = true }
rust-j2k = { workspace = true }

[dev-dependencies]
# The CCT centre tables land in three crates from one generator, so the test
# that checks them against the shared oracle needs to see the GRIB1 one too.
fieldglass-grib1 = { path = "../fieldglass-grib1", version = "=0.4.0" }
serde_json = { workspace = true }
