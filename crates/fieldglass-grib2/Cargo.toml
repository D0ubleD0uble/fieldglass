[package]
name        = "fieldglass-grib2"
description = "GRIB edition 2 reader — full §0–§7 parsing and value decode for every registered §5 packing template, in pure Rust"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["grib", "grib2", "meteorology", "weather", "gis"]
categories  = ["science", "parser-implementations"]

[dependencies]
# The CCSDS 121.0 (AEC) decoder for template 5.42 (ADR-0012). It depends on
# nothing but `thiserror`, which `fieldglass-core` already brings, so it adds
# one crate to this reader's tree and nothing else.
fieldglass-aec = { path = "../fieldglass-aec", version = "=0.5.0" }
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false }
png = { workspace = true }
rust-j2k = { workspace = true }

[dev-dependencies]
# The transport-shaped sources every seam test needs, from one place rather
# than a copy per crate (#708). A dev-dependency feature, so the library is
# still compiled against a core without it.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false, features = ["testing"] }
# The CCT centre tables land in three crates from one generator, so the test
# that checks them against the shared oracle needs to see the GRIB1 one too.
fieldglass-grib1 = { path = "../fieldglass-grib1", version = "=0.5.0" }
serde_json = { workspace = true }

[lints]
workspace = true
