[package]
name = "fieldglass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-neutral API over the Fieldglass decoders: open bytes, decode a field, place it on the Earth, colour it."
keywords = ["grib", "grib2", "meteorology", "weather", "raster"]
categories = ["science", "parser-implementations"]
readme = "README.md"
# Not on crates.io yet. This is the surface ADR-0006 describes, filed under #460
# so `fieldglass-wasm` had something to bind; #464 fixed the `Session` methods
# and DTO fields against a second real consumer and moved the render
# orchestration out of `fieldglass-napi`. What is left before publishing is the
# release process (RELEASING.md), which is written around the four library
# crates.
publish = false

[dependencies]
# `default-features = false` on purpose (ADR-0006, planned/01-crates.md): the
# umbrella sits between every host and `core`, so taking core's defaults here
# would re-enable `fs` for the wasm host by feature unification and drag
# `detect_format`'s `std::fs` into a target that has no filesystem. The two
# surfaces this crate does want are forwarded by this crate's own `render` and
# `analysis` features instead of being pinned on here (#552), so a host can
# decline one; `fs` is not forwarded at all, because ADR-0005 hands every host
# bytes rather than a path.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false, features = ["serde"] }
# Optional so a consumer links only the decoders it opens (#552). Each carries
# its own codecs — GRIB2 alone pulls PNG, AEC, JPEG 2000 and the complex-packing
# paths — and a build that never sees a GRIB1 message should not pay for them.
fieldglass-grib1 = { path = "../fieldglass-grib1", version = "=0.5.0", optional = true }
fieldglass-grib2 = { path = "../fieldglass-grib2", version = "=0.5.0", optional = true }
# The third shipped decoder, reachable through `Session` since #662. Optional
# for the reason the GRIB pair is: a build that never opens a NetCDF file should
# not carry the HDF5 object model and its filter pipeline.
fieldglass-netcdf = { path = "../fieldglass-netcdf", version = "=0.5.0", optional = true }
# Zarr stores, the second container of named arrays (#704). Optional for the
# reason the other decoders are, and with its default `codecs`: a session reads
# values, so it needs the decompressors a store's chunks were written through.
fieldglass-zarr = { path = "../fieldglass-zarr", version = "=0.5.0", optional = true }
# Optional for the reason the decoders are: a host that only decodes bytes it
# already holds never plans a fetch, and the browser bundle is not asked to
# carry a planner it does not call. `fetchplan` forwards `grib2`, because the
# resolver this crate adds on top is built out of the GRIB2 parameter tables.
fieldglass-fetchplan = { path = "../fieldglass-fetchplan", version = "=0.5.0", optional = true }
serde = { workspace = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["grib1", "grib2", "netcdf", "zarr", "render", "analysis", "schema", "conformance", "fetchplan"]

# --- Formats -----------------------------------------------------------------
# One feature per decoder, all on by default, so `Session` dispatches over the
# containers this build actually carries. `detect_from_bytes` stays
# unconditional: a build that cannot open a GRIB1 message should still be able
# to say the bytes *are* GRIB1, which is a different answer from "unknown" and
# the one a host needs to report. At least one of these must be on — see the
# `compile_error!` in `lib.rs`, which is what a consumer gets instead of a
# `Session` with nothing to open.
grib1 = ["dep:fieldglass-grib1"]
grib2 = ["dep:fieldglass-grib2"]
# NetCDF and, behind it, every array dataset: the second addressing mode
# `Session` grows for containers that hold variables rather than messages.
netcdf = ["dep:fieldglass-netcdf"]
# Zarr stores, opened from their objects with `Session::open_store` and
# addressed by variables through the same arm as NetCDF (#704). Neither host
# asks for it yet — both take this crate with `default-features = false` — so
# no bundle carries it until one opens a store (#659).
zarr = ["dep:fieldglass-zarr"]

# --- Surfaces ----------------------------------------------------------------
# `core`'s two optional surfaces, forwarded rather than pinned on, because a
# feature does not stop at a crate boundary (planned/01-crates.md): with the
# umbrella in the middle, a host can only decline `render` if this crate lets it.
#
# They are independent of each other on purpose. `analysis` returns values and
# `render` returns pixels, so a values-first consumer takes `combine`,
# `contours` and CSV without the painter, and a texture-first one takes the
# painter without them. The one member of this crate's surface that needs both
# is `render::contour_polylines`, which traces isolines and then projects them
# onto the render raster; it is compiled only when both are on.
render = ["fieldglass-core/render"]
analysis = ["fieldglass-core/analysis"]

# JSON Schema derives on every API type (ADR-0006 decision 2), which is what a
# host's `.d.ts` is generated from. Off for the wasm host, whose bundle pays for
# every byte and whose declarations come from wasm-bindgen.
schema = ["dep:schemars"]

# Fetch planning (#461, ADR-0005 decision 5): the manifest dialects in both
# addressing shapes — a query over the messages of a GRIB sidecar, and a chunk
# index over an array in a kerchunk reference document (#687) — plus the two
# things a pure planner is not allowed to link: a `ParameterResolver` over the
# GRIB2 tables (#426) and the semantic half of plan verification.
#
# **Default for the reason `conformance` is**, and it is the same trap: `cargo
# test --workspace` does not enable optional features, so an off-by-default
# `fetchplan` would leave `TableResolver`, `verify_message` and
# `tests/fetch_plan_slices_a_message.rs` uncompiled in the one command that is
# supposed to be the gate — passing while checking nothing. Both hosts take this
# crate with `default-features = false`, so neither the addon nor the browser
# bundle carries a planner it does not call; the browser one names it when it
# starts fetching.
#
# Forwards `grib2`, because the resolver is built out of the GRIB2 parameter
# tables.
fetchplan = ["dep:fieldglass-fetchplan", "grib2"]
# The ADR-0006 decision 3 conformance suite: the cases, the recorded
# expectations, and the comparator, so a host's own test drives its binding
# through them (#573).
#
# **Default on purpose.** The suite is this crate's own gate as well as a
# host's, and `cargo test --workspace` does not enable non-default features —
# a `required-features` test target would be skipped there and pass while
# checking nothing. Both hosts take this crate with `default-features = false`,
# so neither the browser bundle nor the addon carries it; `fieldglass-napi`
# asks for it back in `[dev-dependencies]`, and the wasm host's runner reads
# `conformance/suite.json` from Node without linking Rust at all.
#
# **It turns the whole surface on.** The suite is one recorded expectation per
# case over every format and both surfaces, so a partial build has no honest
# subset of it to run — a case whose format is compiled out would have to be
# skipped, and a suite that silently skips is the gate that fails open. Asking
# for `conformance` therefore asks for what it drives, and a build that declines
# a feature declines the suite with it.
conformance = ["dep:serde_json", "grib1", "grib2", "netcdf", "render", "analysis"]

[lints]
workspace = true
