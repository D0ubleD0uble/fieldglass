[package]
name = "fieldglass-fetchplan-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fieldglass-fetchplan = { path = ".." }

# A `SourceSpec` is one entry of the host's source catalog, which is data and
# therefore parsed rather than compiled in. Deserializing one from the fuzz
# input is how the target reaches `SourceSpec::validate`'s key-template scanner
# and the cycle arithmetic behind it.
serde_json = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Keep this crate out of the parent workspace so the standard gates
# (`cargo build/clippy/test --workspace`) — which run on stable — never
# try to compile the nightly-only libFuzzer target.
[workspace]
