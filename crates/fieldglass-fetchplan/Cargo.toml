[package]
name = "fieldglass-fetchplan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reads cloud-native manifests (wgrib2 .idx, ECMWF .index, kerchunk references) and returns a chunk plan: which bytes to fetch, and which chunk or message each range is. No I/O, no clock."
keywords = ["grib", "meteorology", "range-request", "cloud-native"]
categories = ["science", "parser-implementations"]
readme = "README.md"
# Not on crates.io yet, for the same reason `fieldglass` is not: the release
# process (RELEASING.md) is written around the four library crates and this one
# has no consumer outside the workspace until the browser host wires it up.
publish = false

[dependencies]
# JSON-lines is the ECMWF `.index` dialect's whole grammar, and hand-rolling a
# JSON reader to avoid one dependency is how a parser acquires its own escape
# bugs. `float_roundtrip` comes from the workspace pin; nothing here parses a
# float, so it costs this crate only what it costs `fieldglass`.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The `ByteSource` seam ADR-0005 decision 2 landed in #438. A closed plan range
# *is* a `fieldglass_core::ByteRange` — the very type `ByteSource::prefetch`
# takes — so `PlanRange::close` returns one rather than this crate declaring a
# second spelling of the same concept. `default-features = false` for the reason
# the umbrella does it: `fs` has no meaning in a browser.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false }

# The one reader of an array's metadata document (#686). `default-features =
# false` declines the `codecs` feature, so this crate takes the parser and links
# no decompressor: `cargo tree -p fieldglass-fetchplan` carries neither
# `miniz_oxide` nor `ruzstd`.
#
# This is the "no format crate" rule met rather than broken. That rule was about
# *weight* — "a planner that linked a decoder would drag GRIB2's four codecs
# into a host that only wanted to know which bytes to ask for" — and the weight
# is now behind a feature the planner declines. What is taken is a JSON reader
# for a document this crate was parsing itself, twice over, with a second
# vocabulary for refusing the same things.
#
# No GRIB decoder is taken, and none is wanted: semantic matching goes through
# `ParameterResolver`, which `fieldglass` implements over the GRIB2 tables
# (#426), and the §0 envelope check is sixteen bytes of arithmetic that needs no
# table at all.
fieldglass-zarr = { path = "../fieldglass-zarr", version = "=0.5.0", default-features = false }


[dev-dependencies]
# The same crate again, with the codecs this crate's library declines.
# `tests/kerchunk_seam.rs` checks that a range this crate planned holds a chunk
# the decode half can turn into numbers, which needs a decompressor — and a
# dev-dependency reaches the tests and nothing that links the library, so the
# `cargo tree` above stays free of one. Cargo unifies features per build, so
# this is why that check is `cargo tree -p fieldglass-fetchplan` and not a
# `--all-targets` build.
fieldglass-zarr = { path = "../fieldglass-zarr", version = "=0.5.0" }
# The transport-shaped sources (#708): `Recording` to say which ranges a read
# through a reference document asked for, and `OneRange` for the host that
# fetched exactly one of them. A dev-dependency feature, so the library's tree
# stays what the `cargo tree` note above claims.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false, features = ["testing"] }

[lints]
workspace = true
