[package]
name        = "fieldglass-grib1"
description = "GRIB edition 1 reader — full section parsing, value decode for every packing in the wild, and grid geometry"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["grib", "grib1", "meteorology", "weather", "gis"]
categories  = ["science", "parser-implementations"]

[dependencies]
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `decode_reduced_gaussian.rs` contours the field it decodes, which is core's
# `analysis` surface — off for this crate's library, which is parsing only.
# Cargo's v2 resolver keeps a dev-dependency's features out of a build that
# does not build test targets, so the library is still compiled against a core
# with `analysis` off; the pre-commit `--lib` clippy run is what asserts it.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false, features = ["analysis"] }
# The eccodes snapshots are JSON; the cross-check test parses them.
serde_json = { workspace = true }

[lints]
workspace = true
