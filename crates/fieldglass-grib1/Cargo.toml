[package]
name        = "fieldglass-grib1"
description = "GRIB edition 1 reader — full section parsing, value decode for every packing in the wild, and grid geometry"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["grib", "grib1", "meteorology", "weather", "gis"]
categories  = ["science", "parser-implementations"]

[dependencies]
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The eccodes snapshots are JSON; the cross-check test parses them.
serde_json = { workspace = true }

[lints]
workspace = true
