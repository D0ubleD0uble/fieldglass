[package]
name = "fieldglass-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasm-bindgen façade over the Fieldglass decoders for browser hosts."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false`: the umbrella's `schema` feature exists to record
# the JSON schema the declarations are generated from, and that happens in a
# test, not here. This host embeds the generated declarations
# (`src/api.generated.d.ts`), so schemars would be bundle weight with no
# consumer.
#
# The four named features were unconditional in the umbrella until #552 made
# them features, so naming them here holds this host's bundle exactly where it
# was. Declining one is now possible and is deliberately not done in the same
# change: #462's size gate is a ratchet, and a bundle that shrinks for a reason
# unrelated to the measurement it is recorded against is a worse baseline than
# one that did not move.
#
# `netcdf` is the fifth, added by #662, and it is the one that costs something:
# it opts this host into a whole container format and the HDF5 object model and
# filter pipeline behind it, which measured +30.2% on the module and +33.5%
# gzipped — +293,001 and +125,927 bytes, against binaryen 132 as CI pins it. That
# is deliberate rather than incidental. The issue's complaint was that the same
# file rendered in the VS Code editor and was refused in a browser, and a host
# that cannot open one of the three shipped formats is the divergence, not the
# saving. The measured figures are re-recorded in README.md, which is the gate.
fieldglass = { path = "../fieldglass", version = "=0.6.0", default-features = false, features = ["grib1", "grib2", "netcdf", "render", "analysis"] }
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
# The planner's query and options refuse a key they do not know, and
# serde-wasm-bindgen cannot say so: it reads a struct by asking the object for
# each field it expects, so an extra key is never seen. Crossing through a
# `serde_json::Value` lists every key the object has. The planner links
# serde_json already, so this adds a dependency edge and no code.
serde_json = { workspace = true, optional = true }
wasm-bindgen = "0.2"

[features]
# The fetch planner (#1081): `.idx` or `.index` text in, byte ranges plus what
# they should hold out, so an app keeps no sidecar parser of its own. `src/
# fetchplan.rs` is the binding.
#
# **Off by default, pending the owner's choice of where it ships.** Measured
# against binaryen 132, it adds about 93 KB gzipped (+15.0%) to this module, and
# a module of its own would be about 226 KB gzipped, mostly the GRIB2 parameter
# tables this one already carries (107 KB without the table-backed resolver). Whether every page that decodes pays the
# first or a page that plans pays the second is a product decision, recorded on
# #1081; until then the shipped bundle is unchanged and CI builds this feature
# separately (`build.sh nodejs --features=fetchplan`) to run its test.
fetchplan = ["fieldglass/fetchplan", "dep:serde_json"]

[lints]
workspace = true
