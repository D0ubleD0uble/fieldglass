[package]
name = "fieldglass-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The browser version of Fieldglass: its weather-file readers compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false`: the umbrella's `schema` feature exists to record
# the JSON schema the declarations are generated from, and that happens in a
# test, not here. This host embeds the generated declarations
# (`src/api.generated.d.ts`), so schemars would be bundle weight with no
# consumer.
#
# The four named features were unconditional in the umbrella until #552 made
# them features, so naming them here holds this host's bundle exactly where it
# was. Declining one is now possible and is deliberately not done in the same
# change: #462's size gate is a ratchet, and a bundle that shrinks for a reason
# unrelated to the measurement it is recorded against is a worse baseline than
# one that did not move.
#
# `netcdf` is the fifth, added by #662, and it is the one that costs something:
# it opts this host into a whole container format and the HDF5 object model and
# filter pipeline behind it, which measured +30.2% on the module and +33.5%
# gzipped — +293,001 and +125,927 bytes, against binaryen 132 as CI pins it. That
# is deliberate rather than incidental. The issue's complaint was that the same
# file rendered in the VS Code editor and was refused in a browser, and a host
# that cannot open one of the three shipped formats is the divergence, not the
# saving. The measured figures are re-recorded in README.md, which is the gate.
fieldglass = { path = "../fieldglass", version = "=0.6.0", default-features = false, features = ["grib1", "grib2", "netcdf", "render", "analysis"] }
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
# The planner's query and options refuse a key they do not know, and
# serde-wasm-bindgen cannot say so: it reads a struct by asking the object for
# each field it expects, so an extra key is never seen. Crossing through a
# `serde_json::Value` lists every key the object has. The planner links
# serde_json already, so this adds no crate to the bundle, only the `Value`
# conversion code: about 7 KB gzipped of the planner's total below.
serde_json = { workspace = true, optional = true }
wasm-bindgen = "0.2"

[features]
# The fetch planner (#1081): `.idx` or `.index` text in, byte ranges plus what
# they should hold out, so an app keeps no sidecar parser of its own. `src/
# fetchplan.rs` is the binding.
#
# **Off by default.** It ships in the package's second entry,
# `@fieldglass/wasm/full`, built with this and `zarr` (`pack.sh`), and the
# default entry leaves it out: the owner's choice on #1081, implemented by
# #1158. Measured against binaryen 132, it adds about 93 KB gzipped (+15.0%) to
# this module, and a module of its own would have been about 226 KB gzipped,
# mostly the GRIB2 parameter tables this one already carries.
fetchplan = ["fieldglass/fetchplan", "dep:serde_json"]

# Zarr stores (#1083): `openStore` over the objects a page fetched, and the
# window calls that say which objects to fetch — the coordinate chunks, then the
# chunks a lat/lon box and a time step touch — and decode from those alone.
# `src/zarr.rs` is the binding. Its own feature rather than part of `fetchplan`:
# the window planner is a `Session` question answered from the store's own
# metadata and coordinates, and needs neither the sidecar grammars nor the GRIB2
# resolver, so a page that reads stores and plans no GRIB fetches carries
# neither.
#
# **Off by default**, and in the `@fieldglass/wasm/full` entry, as `fetchplan`
# is (#1083, #1158). It brings the Zarr walker and its codecs: blosc with its
# five inner compressors, LZ4 and BloscLZ, zstd (already here for NetCDF), and
# v3 sharding, and `serde_json` for the metadata documents. Measured locally
# against binaryen 132 it adds about 106 KB gzipped (+16.8%) to this module, or
# about 68 KB beside `fetchplan`, which already carries `serde_json`. The README
# gates the full entry's size.
#
# `dep:serde_json` because a window request is read through a JSON value so an
# unknown key is refused, as the planner's query is.
zarr = ["fieldglass/zarr", "dep:serde_json"]

[lints]
workspace = true
