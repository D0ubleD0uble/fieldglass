[package]
name        = "fieldglass-netcdf"
description = "NetCDF format reader — classic (CDF-1/2/5) and NetCDF-4 / HDF5: metadata, dimension scales, and value decode"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["netcdf", "hdf5", "meteorology", "weather", "science"]
categories  = ["science", "parser-implementations"]

[dependencies]
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false }
# DEFLATE (zlib) decode for the HDF5 deflate filter on chunked NetCDF-4 datasets.
miniz_oxide = { workspace = true }
# zstd decode for the HDF5 zstd filter (id 32015) on chunked NetCDF-4 datasets.
ruzstd = { workspace = true }

[dev-dependencies]
# The transport-shaped sources every seam test needs, from one place rather
# than a copy per crate (#708). A dev-dependency feature, so the library is
# still compiled against a core without it.
fieldglass-core = { path = "../fieldglass-core", version = "=0.5.0", default-features = false, features = ["testing"] }
serde_json = { workspace = true }

[lints]
workspace = true
