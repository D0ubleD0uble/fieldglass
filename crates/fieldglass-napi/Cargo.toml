[package]
name        = "fieldglass-napi"
description = "Node.js bindings for Fieldglass via napi-rs"
# cdylib-only binding crate; there is nothing to consume on crates.io. Guard so a
# future bulk `cargo publish` of the workspace can't include it by accident.
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The host-neutral API this binding is a binding *over* (ADR-0006). `schema` is
# off: the JSON Schema is what a declaration generator reads (#574), not what
# the addon needs at runtime, and `schemars` has no business in a `.node`.
fieldglass         = { path = "../fieldglass",        version = "=0.5.0", default-features = false }
fieldglass-core   = { path = "../fieldglass-core",   version = "=0.5.0", features = ["render", "analysis"] }
fieldglass-grib1  = { path = "../fieldglass-grib1",  version = "=0.5.0" }
fieldglass-grib2  = { path = "../fieldglass-grib2",  version = "=0.5.0" }
fieldglass-netcdf = { path = "../fieldglass-netcdf", version = "=0.5.0" }
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
