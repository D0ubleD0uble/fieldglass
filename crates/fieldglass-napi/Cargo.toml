[package]
name        = "fieldglass-napi"
description = "Node.js bindings for Fieldglass via napi-rs"
# cdylib-only binding crate; there is nothing to consume on crates.io. Guard so a
# future bulk `cargo publish` of the workspace can't include it by accident.
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The host-neutral API this binding is a binding *over* (ADR-0006). `schema` is
# off: the JSON Schema is what a declaration generator reads (#574), not what
# the addon needs at runtime, and `schemars` has no business in a `.node`.
# The four it does name were unconditional in the umbrella until #552 made them
# features; the addon opens both GRIB editions and owns the VS Code panel, so it
# takes every one of them.
fieldglass         = { path = "../fieldglass",        version = "=0.5.0", default-features = false, features = ["grib1", "grib2", "render", "analysis"] }
fieldglass-core   = { path = "../fieldglass-core",   version = "=0.5.0", features = ["render", "analysis"] }
fieldglass-grib1  = { path = "../fieldglass-grib1",  version = "=0.5.0" }
fieldglass-grib2  = { path = "../fieldglass-grib2",  version = "=0.5.0" }
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"

[dev-dependencies]
# The conformance suite (ADR-0006 decision 3, #573): the shipped addon does not
# run it, so it is asked for here rather than above. `conformance_host` drives
# this crate's own handles through it and checks they agree with `Session`.
# The umbrella, and for NetCDF the *only* route to the reader (#662). This crate
# used to depend on `fieldglass-netcdf` alongside it and build its NetCDF path
# against the reader directly, so the two hosts had diverged: the browser bundle
# reached the reader through `fieldglass`, the addon reached it twice over by two
# routes. What `Session` does not answer — the backing's own attributes, the
# geometry a host's cache is keyed on — comes through `fieldglass::netcdf`, so
# one place decides the surface a host may use.
fieldglass = { path = "../fieldglass", version = "=0.5.0", default-features = false, features = ["conformance"] }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
