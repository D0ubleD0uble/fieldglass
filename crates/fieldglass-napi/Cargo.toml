[package]
name        = "fieldglass-napi"
description = "Node.js bindings for Fieldglass via napi-rs"
# cdylib-only binding crate; there is nothing to consume on crates.io. Guard so a
# future bulk `cargo publish` of the workspace can't include it by accident.
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The host-neutral API this binding is a binding *over* (ADR-0006), and since
# #726 the only workspace crate below `core` it names: no format crate appears
# here or among the dev-dependencies, which `tools/check_host_dependencies.py`
# enforces. `schema` is
# off: the JSON Schema is what a declaration generator reads (#574), not what
# the addon needs at runtime, and `schemars` has no business in a `.node`.
# The six it does name were unconditional in the umbrella until #552 made them
# features; the addon opens every container this workspace reads and owns the VS
# Code panel, so it takes every one of them. `zarr` is the addon's alone for now:
# the browser bundle has no directory picker, so it does not ask for it (#659).
#
# `netcdf` is named **here** and not left to the `conformance` dev-dependency
# below, which also forwards it. That is the trap #662 walked into: `cargo test`
# unifies a dev-dependency's features into the library build, so the NetCDF path
# compiled under every Rust gate and failed only in the release `.node` build,
# which has no dev-dependencies. A feature the shipped addon needs is a feature
# the shipped addon asks for.
fieldglass         = { path = "../fieldglass",        version = "=0.5.0", default-features = false, features = ["grib1", "grib2", "netcdf", "zarr", "render", "analysis"] }
fieldglass-core   = { path = "../fieldglass-core",   version = "=0.5.0", features = ["render", "analysis"] }
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"

[dev-dependencies]
# The conformance suite (ADR-0006 decision 3, #573): the shipped addon does not
# run it, so it is asked for here rather than above. `conformance_host` drives
# this crate's own handles through it and checks they agree with `Session`.
#
# It forwards `netcdf`, which is why the library entry above must name that
# feature itself — see the note there.
fieldglass = { path = "../fieldglass", version = "=0.5.0", default-features = false, features = ["conformance"] }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
