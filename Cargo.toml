[workspace]
members = [
    "crates/fieldglass-core",
    "crates/fieldglass-grib1",
    "crates/fieldglass-grib2",
    "crates/fieldglass-netcdf",
    "crates/fieldglass-napi",
]
resolver = "2"

[workspace.package]
version    = "0.4.0"
edition    = "2024"
# Minimum supported Rust version. Verified with `cargo +1.88.0 check --workspace`.
# The floor is 1.88: the crates use `let` chains (stabilised in 1.88) and the
# napi bindings require 1.88. Edition 2024 alone would only need 1.85.
rust-version = "1.88"
license    = "MIT OR Apache-2.0"
authors    = ["Cole Hinkel <15200182+D0ubleD0uble@users.noreply.github.com>", "Fieldglass contributors"]
repository = "https://github.com/D0ubleD0uble/fieldglass"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` because serde_json's default float parser is not correctly
# rounded: `to_string` emits the shortest exact representation, but reading it
# back can land one ULP away. Two places care. API types (ADR-0006 decision 2)
# have to survive a JSON round trip bit-for-bit, and the `.eccodes.ref.json`
# oracles are compared against decoded f64s, so the oracle itself must parse
# exactly. Costs a slower parse and nothing else.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Pure-Rust PNG codec for GRIB2 DRS template 5.41 decode (no C deps; MIT/Apache,
# cross-compiles to every release target). See crates/fieldglass-grib2.
png = "0.18"
# Pure-Rust CCSDS/AEC (libaec-compatible) codec for GRIB2 DRS template 5.42
# decode. Purpose-built for GRIB2 5.42 and validated byte-for-byte against the
# eccodes oracle; no C deps, so it preserves the six-target cross-compile.
# Pinned exactly (bus-factor 1 upstream): review the diff on every bump and rely
# on `cargo deny check` for advisory / licence drift. See ADR-0001.
rust-aec = "=0.1.1"
# Pure-Rust JPEG 2000 codec for GRIB2 DRS template 5.40 (grid_jpeg) decode.
# Purpose-built GRIB2-decode-first and validated against the eccodes oracle; no C
# deps, so it preserves the six-target cross-compile that ADR-0001 protects.
# Pinned exactly (young, bus-factor 1 upstream): review the diff on every bump
# and rely on `cargo deny check` for advisory / licence drift. See ADR-0001.
rust-j2k = "=0.3.0"
# Pure-Rust DEFLATE (zlib) codec for the HDF5 deflate filter used by NetCDF-4
# chunked datasets. Already in the tree via the `png` crate; MIT-licensed, no C
# deps. See crates/fieldglass-netcdf.
miniz_oxide = "0.9"
# Pure-Rust zstd decoder for the HDF5 zstd filter (id 32015), netcdf-c >= 4.9's
# recommended compressor for new climate archives. MIT, no C deps and no build
# script, so it preserves the six-target cross-compile ADR-0001 protects. A
# caret range rather than an exact pin: unlike `rust-aec` / `rust-j2k` this is a
# widely-used general-purpose crate, in the same class as `png` and
# `miniz_oxide`. Decode only — we never write zstd.
ruzstd = "0.9"
