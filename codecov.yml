# Codecov configuration. See https://docs.codecov.com/docs/codecov-yaml for
# the full schema.

coverage:
  range: 60..90
  round: down
  precision: 1

  status:
    # Project-wide coverage. `auto` means "compare against the previous
    # commit on the same branch"; threshold 1% allows small dips without
    # failing the check (tests for stub crates can shift overall percent
    # noticeably while real coverage holds).
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    # Patch coverage — the diff in this PR.
    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: rust
      paths:
        - crates/

# Exclusions:
#  - `**/tests/**`: integration-test files exist to exercise library code;
#    counting their own lines as "uncovered" would dilute the real signal.
#  - `crates/fieldglass-napi/src/**`: thin FFI shim — every function takes
#    a `napi::Buffer` and returns napi-typed errors / objects, so it can
#    only be exercised from a Node embedding. The JS side is what should
#    be covered; Rust-side coverage of this crate would be permanently 0%.
#  - `crates/fieldglass-netcdf/src/**`: stub-exclusion to be lifted in a
#    follow-up; pulling it now would bundle an unrelated coverage delta
#    with this PR.
#  - `crates/fieldglass-grib1/src/tables_ecmwf.rs`: a generated lookup table
#    (from eccodes via `tools/gen_ecmwf_tables.py`) — ~500 data match arms.
#    The dispatch is exercised by `tables.rs` tests; counting each data arm
#    as a line to cover would punish the table for being a table.
#  - `crates/fieldglass-grib2/src/tables_ecmf.rs` and
#    `crates/fieldglass-grib2/src/tables_edzw.rs`: the ECMWF and DWD local
#    parameter tables (from `tools/gen_localconcepts_tables.py`) — 2,826 and
#    213 data arms, every one checked against eccodes' own concept engine by
#    `tests/ecmwf_local_parameters.rs` and `tests/dwd_local_parameters.rs`.
#  - `crates/fieldglass-grib2/src/tables_ncep.rs`: the NCEP local parameter
#    table (from `tools/gen_ncep_tables.py`, out of wgrib2) — 479 data arms,
#    cross-checked against eccodes' independent transcription of the same NCO
#    tables by `tests/ncep_local_parameters.rs`.
#  - `crates/fieldglass-grib2/src/tables_wmo_short.rs`: the short-name column
#    of the WMO master parameter table (from `tools/gen_wmo_short_names.py`,
#    out of wgrib2's centre-0 rows) — 1,230 data arms. Every one is reached by
#    the exhaustive walks in `tests/wmo_master_short_names.rs` and in
#    `tables.rs`, which is a stronger guarantee than line coverage.
#  - `crates/fieldglass-grib1/src/tables_cct.rs`,
#    `crates/fieldglass-grib2/src/tables_cct.rs` and
#    `crates/fieldglass-core/src/cct_tables.rs`: the WMO Common Code Table
#    centre and sub-centre tables (from `tools/gen_wmo_cct_tables.py`). Data
#    arms only; `tests/wmo_cct_tables.rs` checks every one of them against the
#    generated oracle, which is a stronger guarantee than line coverage.
#  - `crates/fieldglass-core/src/colormap_tables.rs`: likewise a generated
#    table (from matplotlib via `tools/gen_colormaps.py`) — RGB anchor stops
#    and nothing else. The code that reads it lives in `colormap.rs` and is
#    covered there.
ignore:
  - "crates/fieldglass-napi/src/**"
  - "crates/fieldglass-netcdf/src/**"
  - "crates/fieldglass-grib1/src/tables_ecmwf.rs"
  - "crates/fieldglass-grib2/src/tables_wmo.rs"
  - "crates/fieldglass-grib2/src/tables_ecmf.rs"
  - "crates/fieldglass-grib2/src/tables_edzw.rs"
  - "crates/fieldglass-grib2/src/tables_ncep.rs"
  - "crates/fieldglass-grib2/src/tables_wmo_short.rs"
  - "crates/fieldglass-grib1/src/tables_cct.rs"
  - "crates/fieldglass-grib2/src/tables_cct.rs"
  - "crates/fieldglass-core/src/cct_tables.rs"
  - "crates/fieldglass-core/src/colormap_tables.rs"
  - "**/tests/**"
