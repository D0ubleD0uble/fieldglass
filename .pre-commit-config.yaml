# pre-commit framework config — orchestrates fast checks on `git commit`
# and slower ones on `git push`. Install once per clone:
#
#     pre-commit install --hook-type pre-commit --hook-type pre-push
#
# (npm install at the repo root does this automatically via the prepare hook.)

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ─── Workspace tooling — reuses the user's installed cargo / npm / semgrep
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        language: system
        types: [rust]
        entry: cargo fmt --all -- --check
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        entry: cargo clippy --all-targets --workspace -- -D warnings
        pass_filenames: false

      - id: cargo-clippy-core-no-default
        name: cargo clippy -p fieldglass-core --no-default-features -- -D warnings
        language: system
        types: [rust]
        # Guards the gated build: `render` off must still compile clean so the
        # parsing-only surface the format crates consume can't rot.
        entry: cargo clippy -p fieldglass-core --no-default-features --all-targets -- -D warnings
        pass_filenames: false

      - id: cargo-clippy-format-crates-render-off
        name: cargo clippy (format crates against render-off core)
        language: system
        types: [rust]
        # The real #227 backstop. Selecting only the format crates keeps
        # fieldglass-napi (the sole `render` consumer) out of the build graph, so
        # core resolves with `default-features = false` and `render` OFF. A
        # format crate that reaches into a gated `warp`/`overlay`/`colormap`
        # symbol fails here — a `--workspace` build would hide it, since napi's
        # `render` request unifies the feature back on for everyone.
        entry: cargo clippy -p fieldglass-grib1 -p fieldglass-grib2 -p fieldglass-netcdf --all-targets -- -D warnings
        pass_filenames: false

      - id: cargo-clippy-format-crates-parsing-only
        name: cargo clippy (format crate libraries, parsing surface only)
        language: system
        types: [rust]
        # `--lib` is load-bearing, not a speed-up. The hook above builds test
        # targets, and `fieldglass-grib1` asks for core's `analysis` feature in
        # `[dev-dependencies]` (one test contours what it decodes) — which the
        # v2 resolver then unifies on for grib2 and netcdf in the same
        # invocation. So a library file reaching into `core::contour` /
        # `::csv` / `::combine` compiles there and breaks only for a real
        # consumer taking core with `default-features = false`. `--lib` builds
        # no test target, so no dev-dependency feature is unified in, and the
        # three libraries are held to the parsing surface their crate docs
        # claim (#551).
        entry: cargo clippy -p fieldglass-grib1 -p fieldglass-grib2 -p fieldglass-netcdf --lib -- -D warnings
        pass_filenames: false

      - id: tsc-extension
        name: tsc --noEmit (extension)
        language: system
        files: ^extension/(src/.*\.ts|tsconfig\.json|package\.json)$
        entry: bash -c 'cd extension && npx --no-install tsc --noEmit'
        pass_filenames: false

      - id: eslint-extension
        name: eslint (extension)
        language: system
        files: ^extension/(src/.*\.ts|eslint\.config\.mjs|package\.json)$
        entry: bash -c 'cd extension && npx --no-install eslint .'
        pass_filenames: false

      - id: verusfmt
        name: verusfmt (verification crate)
        # `language: rust` rather than `system`: pre-commit builds verusfmt into
        # its own cached environment, so CI and a fresh clone both get it
        # without a bespoke install step, pinned the same way the fetched hooks
        # below are. rustfmt does not understand `verus! { }` blocks — verusfmt
        # is their formatter and the two are designed to coexist.
        #
        # Path-scoped: only the verification crate is written in Verus syntax,
        # so a contributor who never touches it never pays for the build.
        language: rust
        additional_dependencies: ["cli:verusfmt:0.7.2"]
        files: ^crates/fieldglass-verify/src/.*\.rs$
        entry: verusfmt --check

      - id: architecture-diagrams
        name: architecture diagrams in sync with source
        language: system
        files: ^(crates/.*\.rs|crates/.*/Cargo\.toml|docs/architecture/.*\.md|tools/check_architecture_diagrams\.py)$
        entry: python3 tools/check_architecture_diagrams.py
        pass_filenames: false

      - id: generator-encoding
        name: generators name their text encoding
        language: system
        files: ^tools/.*\.py$
        entry: python3 tools/check_generator_encoding.py
        pass_filenames: false

      - id: workspace-lints
        name: every workspace member inherits [workspace.lints]
        language: system
        # A member that omits `lints.workspace = true` compiles under the
        # default lint levels and cargo says nothing, so the inheritance is
        # checked rather than assumed. Also ratchets the `missing_docs`
        # opt-outs; see the checker's docstring.
        files: ^(Cargo\.toml|crates/[^/]+/(Cargo\.toml|src/lib\.rs)|tools/check_workspace_lints\.py)$
        entry: python3 tools/check_workspace_lints.py
        pass_filenames: false

      - id: format-crate-reexports
        name: format crates re-export the core names their signatures use
        language: system
        # `tests/crate-independence` catches a re-export that is deleted; this
        # catches one that is never written, which compiles fine and costs a
        # consumer a `fieldglass-core` line in their own manifest.
        files: ^(crates/fieldglass-(grib1|grib2|netcdf)/src/.*\.rs|tools/check_format_crate_reexports\.py)$
        entry: python3 tools/check_format_crate_reexports.py
        pass_filenames: false

      # ── Pre-push (slower) hooks
      - id: architecture-diagrams-selftest
        name: architecture diagram checker self-test
        stages: [pre-push]
        language: system
        files: ^tools/(check_architecture_diagrams|test_check_architecture_diagrams)\.py$
        entry: python3 tools/test_check_architecture_diagrams.py
        pass_filenames: false

      - id: generator-encoding-selftest
        name: generator encoding checker self-test
        stages: [pre-push]
        language: system
        files: ^tools/(check_generator_encoding|test_check_generator_encoding)\.py$
        entry: python3 tools/test_check_generator_encoding.py
        pass_filenames: false

      - id: workspace-lints-selftest
        name: workspace-lints checker self-test
        stages: [pre-push]
        language: system
        files: ^tools/(check_workspace_lints|test_check_workspace_lints)\.py$
        entry: python3 tools/test_check_workspace_lints.py
        pass_filenames: false

      - id: format-crate-reexports-selftest
        name: format-crate re-export checker self-test
        stages: [pre-push]
        language: system
        files: ^tools/(check_format_crate_reexports|test_check_format_crate_reexports)\.py$
        entry: python3 tools/test_check_format_crate_reexports.py
        pass_filenames: false

      - id: wasm-bundle-size-selftest
        name: wasm bundle-size checker self-test
        stages: [pre-push]
        language: system
        # The crate README is in the pattern because the checker reads its table
        # as the gate's source of truth, and one of the tests asserts that the
        # real README still parses.
        files: ^(tools/(check_wasm_bundle_size|test_check_wasm_bundle_size)\.py|crates/fieldglass-wasm/README\.md)$
        entry: python3 tools/test_check_wasm_bundle_size.py
        pass_filenames: false

      - id: fetch-samples-selftest
        name: sample-fetch script self-test
        stages: [pre-push]
        language: system
        files: ^tools/(fetch_samples|test_fetch_samples)\.sh$
        entry: bash tools/test_fetch_samples.sh
        pass_filenames: false

      - id: cargo-test
        name: cargo test --workspace
        stages: [pre-push]
        language: system
        entry: cargo test --workspace
        pass_filenames: false

      - id: cargo-test-core-no-default
        name: cargo test -p fieldglass-core --no-default-features
        stages: [pre-push]
        language: system
        entry: cargo test -p fieldglass-core --no-default-features
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny check
        stages: [pre-push]
        language: system
        # `--locked` keeps cargo-deny from refreshing the registry index or
        # rewriting Cargo.lock under the hood (which the pre-commit framework
        # would interpret as "files were modified by this hook" and fail the
        # push, even though the underlying advisory/license check is OK).
        entry: cargo deny --locked check
        pass_filenames: false

      - id: npm-audit-extension
        name: npm audit --omit=dev (extension)
        stages: [pre-push]
        language: system
        entry: bash -c 'cd extension && npm audit --omit=dev || echo "npm audit reported issues — review with npm audit"'
        pass_filenames: false

      - id: npm-audit-root
        name: npm audit --omit=dev (root)
        stages: [pre-push]
        language: system
        entry: bash -c 'npm audit --omit=dev || echo "npm audit reported issues at the workspace root — review with npm audit"'
        pass_filenames: false

  # ─── Auto-fetched pinned binaries — no manual install required
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^extension/tsconfig\.json$   # tsconfig.json allows comments; check-json doesn't
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=2048]                  # block accidentally-staged big binaries

  # shellcheck-py ships the same ShellCheck binary as a Python wheel; the
  # upstream koalaman hook runs it out of a Docker image, which made every run
  # a Docker Hub pull. A registry timeout there fails the hook with exit 125
  # before any file is linted — an infrastructure outage reported as a lint
  # failure, red on master. The `v0.10.0.1` tag is ShellCheck v0.10.0 (the
  # trailing `.1` is the packaging revision), so the lint itself is unchanged.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Semgrep auto-installs into an isolated python env — no manual install.
  - repo: https://github.com/semgrep/semgrep
    rev: v1.162.0
    hooks:
      - id: semgrep
        stages: [pre-push]
        pass_filenames: false
        args:
          - scan
          - --quiet
          - --severity=ERROR
          - --error
          - --config=p/default
          - --config=p/security-audit
          - --config=p/owasp-top-ten
          - --config=p/rust
          - --config=p/typescript
          - --config=p/secrets
          - --config=p/github-actions
