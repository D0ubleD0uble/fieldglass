      # cargo-fuzz needs the nightly libFuzzer sanitizer runtime; the fuzz jobs
      # are the only ones in the repo that build on nightly. The normal gates
      # stay on stable — the fuzz crate is excluded from the workspace so they
      # never touch it.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
