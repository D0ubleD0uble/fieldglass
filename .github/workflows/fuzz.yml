name: Fuzz

on:
  push:
    branches: [master]
    paths:
      - 'crates/fieldglass-grib1/**'
      - 'crates/fieldglass-grib2/**'
      - 'crates/fieldglass-netcdf/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths:
      - 'crates/fieldglass-grib1/**'
      - 'crates/fieldglass-grib2/**'
      - 'crates/fieldglass-netcdf/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  # `cargo fuzz run` has no `--locked` (cargo-fuzz 0.13.2 exposes no such
  # flag), so a stale fuzz lockfile is silently re-resolved and rewritten mid-
  # run: #398 found the GRIB2 lock pinning rust-j2k 0.2.0 for a whole release
  # cycle while the workspace pinned =0.3.0, and building the target dirtied
  # the tree. `cargo metadata --locked` is the equivalent check — it resolves
  # without building and exits non-zero when the lock disagrees with the
  # manifest — so drift fails loudly here instead of being absorbed.
  #
  # The check itself lives in `tools/check_nested_lockfiles.py`, which is also a
  # commit-stage pre-commit hook: one implementation, so the gate a contributor
  # runs and the gate that blocks the merge cannot disagree. It covers every
  # crate carrying its own lockfile, `crates/fieldglass-verify` included, which
  # is wider than this workflow's path filter ever brings it here for. This job
  # is the fuzz jobs' own precondition, not the only place the check runs: the
  # `pre-commit` job in `ci.yml` has no path filter and runs the checker and its
  # self-test on every pull request, which is what covers `fieldglass-verify`
  # and an edit to the checker itself. Adding those paths here instead would
  # start three 15-minute fuzz campaigns for a change that cannot reach a fuzz
  # target.
  #
  # The fuzz jobs depend on this, which does mean a bumped dependency whose
  # fuzz lock was not refreshed blocks fuzzing until someone runs
  # `cargo update` in that directory. Dependabot now watches these lockfiles
  # (see .github/dependabot.yml), so that should be rare rather than routine.
  lockfiles:
    name: Nested lockfiles in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stable is enough: this resolves the dependency graph, it does not
      # build the nightly-only fuzz target.
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Each nested crate's Cargo.lock matches its manifest
        run: python3 tools/check_nested_lockfiles.py

      # The checker reports an absence, so its own tests are what stop it
      # rotting into a green no-op. Bookkeeping over temporary directories,
      # plus two cases that run the real check against this tree; no fuzz
      # build, so stable is still enough.
      - name: Nested-lockfile checker self-test
        run: python3 tools/test_check_nested_lockfiles.py

  grib1-decode:
    name: GRIB1 decode (cargo-fuzz, time-boxed)
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz needs the nightly libFuzzer sanitizer runtime; this is the
      # only job in the repo that builds on nightly. The normal gates stay on
      # stable — the fuzz crate is excluded from the workspace so they never
      # touch it.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/fieldglass-grib1/fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz

      # Time-boxed run seeded by the committed corpus (the GRIB1 test
      # fixtures). Not the normal `cargo test` gate — this is a bounded smoke
      # fuzz that asserts the decode path neither panics nor hangs.
      #
      # `--target` is pinned to the gnu host: left to its default, cargo-fuzz
      # selects the musl target on the hosted runner, which can't link the
      # ASan runtime against a static libc.
      - name: Fuzz the GRIB1 decode path
        run: cargo fuzz run decode --target x86_64-unknown-linux-gnu -- -max_total_time=120 -timeout=10
        working-directory: crates/fieldglass-grib1/fuzz

  grib2-decode:
    name: GRIB2 decode (cargo-fuzz, time-boxed)
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz needs the nightly libFuzzer sanitizer runtime; the normal
      # gates stay on stable — the fuzz crate is excluded from the workspace so
      # they never touch it.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/fieldglass-grib2/fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz

      # Time-boxed run seeded by the committed corpus (the GRIB2 test
      # fixtures). Not the normal `cargo test` gate — this is a bounded smoke
      # fuzz that asserts the decode path neither panics nor hangs.
      #
      # `--target` is pinned to the gnu host: left to its default, cargo-fuzz
      # selects the musl target on the hosted runner, which can't link the
      # ASan runtime against a static libc.
      - name: Fuzz the GRIB2 decode path
        run: cargo fuzz run decode --target x86_64-unknown-linux-gnu -- -max_total_time=120 -timeout=10
        working-directory: crates/fieldglass-grib2/fuzz

  netcdf-parse:
    name: NetCDF parse (cargo-fuzz, time-boxed)
    needs: lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz needs the nightly libFuzzer sanitizer runtime; the normal
      # gates stay on stable — the fuzz crate is excluded from the workspace so
      # they never touch it.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/fieldglass-netcdf/fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz

      # Time-boxed run seeded by the committed corpus (the NetCDF test
      # fixtures). Not the normal `cargo test` gate — this is a bounded smoke
      # fuzz that asserts the header parse path neither panics nor hangs.
      #
      # `--target` is pinned to the gnu host: left to its default, cargo-fuzz
      # selects the musl target on the hosted runner, which can't link the
      # ASan runtime against a static libc.
      - name: Fuzz the NetCDF parse path
        run: cargo fuzz run parse --target x86_64-unknown-linux-gnu -- -max_total_time=120 -timeout=10
        working-directory: crates/fieldglass-netcdf/fuzz
