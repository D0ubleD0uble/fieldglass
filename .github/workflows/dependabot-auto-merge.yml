name: Dependabot auto-merge

# Auto-approve and enable auto-merge for low-risk Dependabot updates so they
# land without manual babysitting once CI is green. Branch protection still
# gates the actual merge on required checks. Higher-risk bumps stay manual (see
# the gate below).
#
# Arming auto-merge is enough on its own. Branch protection deliberately does
# not set required_status_checks.strict, so a PR whose checks are green merges
# even after master has moved past it. An earlier dependabot-refresh.yml existed
# to rebase branches back up to date under the strict rule; it could not work,
# because Dependabot ignores `@dependabot rebase` from anyone without push
# access and GITHUB_TOKEN posts as github-actions[bot]. Dropping strict removed
# the need for it.
#
# Runs on pull_request_target so the GITHUB_TOKEN has write scope (Dependabot
# PRs otherwise get a read-only token). This is safe because the job never
# checks out or executes the PR's code — it only reads trusted metadata and
# calls the GitHub API.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge only:
      #   - any patch bump (dev or prod), or
      #   - any dev-dependency bump up to and including minor.
      # Major bumps and production minor bumps are intentionally excluded so a
      # human reviews them. For grouped PRs, update-type/dependency-type reflect
      # the highest-risk member of the group, so the gate stays conservative.
      - name: Approve and enable auto-merge for low-risk updates
        if: >
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.dependency-type == 'direct:development')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
