name: Semgrep

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly Mon 06:00 UTC — catches new rules added to the rule packs.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab
  pull-requests: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # SARIF upload to GitHub Code Scanning needs either a public repo or
    # GitHub Advanced Security. Skip until the repo is public.
    if: github.event.repository.visibility == 'public'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # Findings are at zero, so this now fails the build rather than only
        # reporting. A new finding is either a real one to fix or a false
        # positive to silence at the source with a `nosemgrep` naming the rule
        # — a dismissal in the Security tab does not reach the CLI, so it would
        # leave the build red.
        run: |
          semgrep scan --error \
            --sarif --output=semgrep.sarif \
            --config p/default \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/rust \
            --config p/typescript \
            --config p/secrets \
            --config p/github-actions

      - name: Drop suppressed results from the SARIF
        if: always()
        # A `nosemgrep` keeps a finding out of the CLI's exit code but not out
        # of the SARIF, where it is emitted with `suppressions: [inSource]`.
        # Uploading those raises a code scanning alert for every suppression we
        # have deliberately reviewed and silenced, which then has to be
        # dismissed by hand — once per suppression, forever.
        #
        # So upload exactly what the gate would fail on. The rules array is
        # left intact, which is what lets GitHub mark a previously reported
        # alert as fixed rather than leaving it open with no result to match.
        run: |
          python3 - <<'FILTER'
          import json, pathlib

          path = pathlib.Path("semgrep.sarif")
          report = json.loads(path.read_text())
          for run in report.get("runs", []):
              results = run.get("results", [])
              kept = [r for r in results if not r.get("suppressions")]
              print(f"dropped {len(results) - len(kept)} suppressed of {len(results)}")
              run["results"] = kept
          path.write_text(json.dumps(report))
          FILTER

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep
