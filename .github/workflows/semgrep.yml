name: Semgrep

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly Mon 06:00 UTC — catches new rules added to the rule packs.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab
  pull-requests: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # SARIF upload to GitHub Code Scanning needs either a public repo or
    # GitHub Advanced Security. Skip until the repo is public.
    if: github.event.repository.visibility == 'public'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # Findings are at zero, so this now fails the build rather than only
        # reporting. A new finding is either a real one to fix or a false
        # positive to silence at the source with a `nosemgrep` naming the rule
        # — a dismissal in the Security tab does not reach the CLI, so it would
        # leave the build red.
        run: |
          semgrep scan --error \
            --sarif --output=semgrep.sarif \
            --config p/default \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/rust \
            --config p/typescript \
            --config p/secrets \
            --config p/github-actions

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep
