name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger for dry-run smoke tests of the build + package matrix and
    # the release-notes check. Every publish is gated on a tag ref, so manual
    # runs build artifacts and stop short of touching any registry.

# Every tag is a stable release. The extension publishes to the Marketplace's
# stable channel and the library crates go to crates.io, both from the same tag.
#
# There is no pre-release channel. The Marketplace has one version sequence
# shared by both channels and each version can only be published once, so
# routing pre-releases automatically means encoding the channel in the version
# number (the odd/even-minor convention). That makes the minor digit a channel
# bit rather than a semantic one, which fights crates.io — where cargo reads
# semver strictly. Plain semver won instead. If a soak build is ever wanted,
# `vsce publish --pre-release` is a per-publish flag: publish one version with
# it, the next without.

permissions:
  contents: read

jobs:
  build-native:
    name: Build native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fieldglass.linux-x64-gnu.node
            vsce_target: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: fieldglass.linux-arm64-gnu.node
            vsce_target: linux-arm64
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: fieldglass.win32-x64-msvc.node
            vsce_target: win32-x64
          - os: windows-2025-vs2026
            target: aarch64-pc-windows-msvc
            artifact: fieldglass.win32-arm64-msvc.node
            vsce_target: win32-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: fieldglass.darwin-x64.node
            vsce_target: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: fieldglass.darwin-arm64.node
            vsce_target: darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install aarch64 Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install napi-rs CLI
        run: npm ci

      - name: Build native module
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npx napi build --platform --release --target ${{ matrix.target }} --output-dir ${{ github.workspace }}/extension/bin
        working-directory: crates/fieldglass-napi

      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.vsce_target }}
          path: extension/bin/${{ matrix.artifact }}
          if-no-files-found: error

  package:
    name: Package .vsix (${{ matrix.vsce_target }})
    needs: [build-native]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vsce_target:
          - linux-x64
          - linux-arm64
          - win32-x64
          - win32-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Download native artifact for this target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.vsce_target }}
          path: extension/bin

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      # The same vsce the `publish` job uses.
      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Package extension (--target ${{ matrix.vsce_target }})
        run: |
          mkdir -p ${{ github.workspace }}/dist
          vsce package \
            --target ${{ matrix.vsce_target }} \
            --no-dependencies \
            --out ${{ github.workspace }}/dist/
        working-directory: extension

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: dist/*.vsix
          if-no-files-found: error

  # Runs before anything is published, and on a dry run too (#858). The
  # Release action cuts a body at 124,999 characters without a warning, so an
  # oversized CHANGELOG section would ship as truncated notes, after the
  # Marketplace, crates.io and npm already hold the version. So every
  # publishing job waits for this one, and the GitHub Release body it checks is
  # the one the `publish` job uses.
  release-notes:
    name: Check release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a tag, the `## [X.Y.Z]` section, which must exist and match the
      # workspace version. On a dry run there is no tag, so it checks the
      # workspace version's section, which must exist, and `## [Unreleased]` if
      # it has content. Either way it fails at 125,000 characters or more.
      # `tools/release_notes.py` has the details.
      - name: Extract and check release notes
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/release_notes.py --tag "$GITHUB_REF_NAME" --out release-notes.md
          else
            python3 tools/release_notes.py --dry-run --out release-notes.md
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Checks that the stored Marketplace token can still publish for the
  # `fieldglass` publisher. It runs on a dry run too, so an expired token shows
  # up there rather than at the tag, and every publishing job waits for it: a
  # token that fails here stops the release before any registry has the
  # version, instead of after crates.io and npm already do.
  marketplace-token:
    name: Check Marketplace token
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Verify the token can publish for fieldglass
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce verify-pat fieldglass

  publish:
    name: Publish to Marketplace + GitHub Release
    needs: [package, release-notes, marketplace-token]
    # A manual workflow_dispatch run (dry run) builds, packages and checks the
    # release notes; only pushed tags trigger the actual publish + release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download all .vsix artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      # The curated CHANGELOG section for this version, not GitHub's
      # auto-generated commit list. `release-notes` extracted and checked it.
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Pinned: re-run safety rests on `--skip-duplicate` behaving as read in
      # this version's source (it matches on version and target platform).
      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      # `--skip-duplicate` makes a re-run safe (#858). vsce checks each
      # package's version and target platform against the Marketplace and skips
      # one that is already there, so a run that failed after publishing some
      # targets, or after all of them, carries on to the GitHub Release.
      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          args=()
          for vsix in dist/*.vsix; do
            args+=(--packagePath "$vsix")
          done
          vsce publish --skip-duplicate "${args[@]}"

      # Re-running this updates the existing Release and replaces its assets
      # (`overwrite_files` defaults to true), so it is safe to repeat.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.vsix
          prerelease: false
          body_path: release-notes.md

  publish-crates:
    name: Publish library crates to crates.io
    needs: [package, release-notes, marketplace-token]
    # Every tag is a release, so every tag publishes the crates. A
    # workflow_dispatch dry run has no tag, so it skips this job and keeps its
    # no-side-effects property.
    #
    # Gated on `package` so the crates only go out if every native target built,
    # and on `release-notes` so they only go out if the GitHub Release can be
    # made: a version on crates.io cannot be taken back, only yanked.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived registry
      # token, so no long-lived crates.io secret is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check the tag matches the workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "fieldglass-core") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${crate_version}" >&2
            exit 1
          fi
          echo "Publishing version ${crate_version}"

      # The pre-commit hook runs this on every change; here it guards the exact
      # tree being published, since a version on crates.io cannot be replaced
      # (#1545 shipped 0.6.0 without the license files).
      - name: Check every crate packs its license files
        run: python3 tools/check_crate_license_files.py

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the library crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Is this exact version already on crates.io? A release re-run after a
          # partial failure must skip what already went out — `cargo publish`
          # errors on an existing version, which would otherwise fail the job.
          # Queried against the sparse index, whose path layout is fixed by name
          # length (crates.io: 1, 2, 3/x, then xx/yy).
          published() {
            local name="$1" want="$2" path body
            case ${#name} in
              1) path="1/${name}" ;;
              2) path="2/${name}" ;;
              3) path="3/${name:0:1}/${name}" ;;
              *) path="${name:0:2}/${name:2:2}/${name}" ;;
            esac
            # A 404 means the crate has never been published, so neither has this
            # version. Any other failure is treated the same way: attempt the
            # publish and let cargo be the authority.
            body="$(curl -sfL "https://index.crates.io/${path}")" || return 1
            grep -q "\"vers\":\"${want}\"" <<<"$body"
          }

          # `fieldglass-aec` first, then `fieldglass-core`: every format crate
          # pins core with `=`, and `fieldglass-grib2` also pins aec, so they
          # cannot even be packaged until those are in the index. `cargo publish` waits for each upload to propagate before
          # returning, so the next crate in the list resolves the one before it.
          # `fieldglass-aec` leads for a second reason: its Trusted Publishing is
          # configured by hand after its first, manual publish (ADR-0012
          # decision 10), so if that was missed it fails here, before anything
          # else goes out.
          #
          # `fieldglass-zarr`, `fieldglass-fetchplan` and `fieldglass` follow, in
          # that order: zarr pins core, fetchplan pins zarr, and the umbrella pins
          # every crate before it, so it goes last. Each had a manual first
          # publish too (#851); a missed one fails here after the five ahead of
          # it are out, and a re-run skips those.
          for crate in fieldglass-aec fieldglass-core fieldglass-grib1 fieldglass-grib2 fieldglass-netcdf \
                       fieldglass-zarr fieldglass-fetchplan fieldglass; do
            if published "$crate" "$version"; then
              echo "${crate} ${version} is already on crates.io — skipping"
              continue
            fi
            echo "Publishing ${crate} ${version}"
            cargo publish -p "$crate"
          done

  publish-wasm-npm:
    name: Publish @fieldglass/wasm to npm
    # `release-notes` for the same reason as `publish-crates`: npm keeps a
    # version once it is published.
    needs: [package, release-notes, marketplace-token]
    runs-on: ubuntu-latest
    env:
      # Must match ci.yml's pin, which is what the bundle-size gate measures
      # against: a release built with a different optimizer is not the module
      # whose size the README records. `tools/check_binaryen_pin.py` keeps the
      # two files in step.
      BINARYEN_VERSION: version_132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived npm
      # token, the same pattern `publish-crates` uses for crates.io, so no
      # long-lived npm secret is stored in the repo. npm generates the
      # provenance attestation automatically from it; `--provenance` is not
      # passed and is not needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Trusted Publishing needs npm 11.5.1 or later, and Node 22 ships an
      # older npm than that. Upgrading explicitly rather than relying on
      # whatever the runner image happens to carry, because the failure without
      # it is an authentication error at the last step of a release.
      - name: Install an npm that can publish with OIDC
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      - name: Read the resolved wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          set -euo pipefail
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                     | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)"
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          tarball="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${tarball}"
          echo "${BINARYEN_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar xzf "$tarball" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      # Runs on a workflow_dispatch too, which is what makes the dry run useful:
      # it produces the exact tarball a tag would publish, and the step after it
      # proves that tarball installs and decodes. Only the publish itself is
      # gated on the tag.
      - name: Build the package
        run: crates/fieldglass-wasm/pack.sh

      - name: Check it installs and decodes
        run: node crates/fieldglass-wasm/tests/node/package.mjs

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          packed="$(node -p 'require("./crates/fieldglass-wasm/pkg/npm/package.json").version')"
          if [ "$tag_version" != "$packed" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${packed}" >&2
            exit 1
          fi
          echo "Publishing @fieldglass/wasm ${packed}"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldglass-wasm-npm
          path: crates/fieldglass-wasm/pkg/npm/*.tgz
          if-no-files-found: error

      # Only on a tag, so a workflow_dispatch run keeps its no-side-effects
      # property — the same rule `publish-crates` follows.
      #
      # Re-running a release after a partial failure must not fail here on a
      # version that already went out, so an existing version is skipped rather
      # than published again. npm, unlike crates.io, answers this without
      # authentication.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "@fieldglass/wasm@${version}" version >/dev/null 2>&1; then
            echo "@fieldglass/wasm ${version} is already on npm — skipping"
            exit 0
          fi
          cd crates/fieldglass-wasm/pkg/npm
          npm publish
