name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger for dry-run smoke tests of the build + package matrix and
    # the release-notes check. Every publish is gated on a tag ref, so manual
    # runs build artifacts and stop short of touching any registry.

# Every tag is a stable release. The extension publishes to the Marketplace's
# stable channel and the library crates go to crates.io, both from the same tag.
#
# There is no pre-release channel. The Marketplace has one version sequence
# shared by both channels and each version can only be published once, so
# routing pre-releases automatically means encoding the channel in the version
# number (the odd/even-minor convention). That makes the minor digit a channel
# bit rather than a semantic one, which fights crates.io — where cargo reads
# semver strictly. Plain semver won instead. If a soak build is ever wanted,
# `vsce publish --pre-release` is a per-publish flag: publish one version with
# it, the next without.

permissions:
  contents: read

env:
  # The exact Rust release that builds everything this workflow ships: the
  # native modules, the crates' publish verification and the wasm package
  # (#1749, #1877). So the compiler is a recorded choice rather than whatever
  # `stable` is on the day of the tag. Set workflow-wide so every rustc and
  # cargo in every job is this one, the way semver.yml pins its toolchain,
  # and every "Set up Rust" installs the same value. 1.99.1 built 0.6.1.
  #
  # The wasm module links Rust's standard library, and the package ships that
  # release's own COPYRIGHT-library.html as its notice. ci.yml's `wasm` job
  # measures the module's size with the same pin. Bump the two together, on
  # purpose: `tools/check_binaryen_pin.py` fails when they differ, when this
  # is not an exact version, or when a "Set up Rust" here does not read it.
  # The `release-pins` job runs that check on every release run.
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  # Fails the run before anything publishes if a Rust job here would build
  # with another compiler than the pin above (#1877). The checker's self-test
  # runs first, so a checker that stopped reading the workflow cannot pass.
  # The pre-commit hook runs the same check on every change to this file.
  release-pins:
    name: Check the release pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every Rust job builds with the pinned toolchain
        run: |
          set -euo pipefail
          (cd tools && python3 test_check_binaryen_pin.py)
          python3 tools/check_binaryen_pin.py

  build-native:
    name: Build native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux links against the glibc 2.17 sysroot of napi-rs's prebuilt
          # cross toolchain, not the runner's own glibc (2.39), so the module
          # loads on the glibc 2.28 floor (#1866). "Check the glibc floor"
          # below holds it there.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: fieldglass.linux-x64-gnu.node
            vsce_target: linux-x64
            napi_flags: --use-napi-cross
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: fieldglass.linux-arm64-gnu.node
            vsce_target: linux-arm64
            napi_flags: --use-napi-cross
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: fieldglass.win32-x64-msvc.node
            vsce_target: win32-x64
          - os: windows-2025-vs2026
            target: aarch64-pc-windows-msvc
            artifact: fieldglass.win32-arm64-msvc.node
            vsce_target: win32-arm64
          # Exact images rather than macos-latest, so a new image is a
          # deliberate change (#1877). macos-26 is arm64: the x64 module is
          # cross-compiled there, and smoke-native loads it on Intel.
          - os: macos-26
            target: x86_64-apple-darwin
            artifact: fieldglass.darwin-x64.node
            vsce_target: darwin-x64
          - os: macos-26
            target: aarch64-apple-darwin
            artifact: fieldglass.darwin-arm64.node
            vsce_target: darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # The runner images carry their own `stable`, which cargo would use if
      # the pin stopped reaching it.
      - name: Check the pinned Rust is the one in use
        shell: bash
        run: |
          set -euo pipefail
          release="$(rustc -V | cut -d' ' -f2)"
          if [ "$release" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error::rustc is ${release}, not the pinned ${RUSTUP_TOOLCHAIN}" >&2
            exit 1
          fi
          echo "Building with rustc ${release}"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Also installs @napi-rs/cross-toolchain at the version package-lock.json
      # pins. `--use-napi-cross` fetches that exact version's toolchain for the
      # target from npm, where a published version cannot change.
      - name: Install napi-rs CLI
        run: npm ci

      # No linker is set here: `--use-napi-cross` sets the Linux linker only
      # when none is set already, and the runner's own would link against its
      # glibc 2.39.
      - name: Build native module
        run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.napi_flags }} --output-dir ${{ github.workspace }}/extension/bin
        working-directory: crates/fieldglass-napi

      # Holds the module itself to the pin, the way the wasm job checks its
      # `/rustc/<commit>/` paths (#1877). The standard library's panic
      # locations carry the commit of the rustc that built it, so a module
      # built by any other compiler names another commit. The pin is read from
      # this file rather than the environment, and the commit from that exact
      # toolchain, so an override the pin checker reads past (a `$GITHUB_ENV`
      # write, an inline `RUSTUP_TOOLCHAIN`, `cargo +stable`) fails here. It is
      # read from the committed blob, with carriage returns dropped, because
      # the Windows checkout converts the working copy to CRLF.
      - name: Check the module was built by the pinned Rust
        shell: bash
        env:
          MODULE: extension/bin/${{ matrix.artifact }}
        run: |
          set -euo pipefail
          pin="$(git show HEAD:.github/workflows/release.yml | tr -d '\r' | sed -n 's/^  RUSTUP_TOOLCHAIN: *//p')"
          if ! [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read one pinned release from release.yml's env: '${pin}'" >&2
            exit 1
          fi
          info="$(rustc "+${pin}" -vV)"
          commit="$(sed -n 's/^commit-hash: //p' <<<"$info")"
          release="$(sed -n 's/^release: //p' <<<"$info")"
          if [ "$release" != "$pin" ] || ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rustc +${pin} -vV does not name release ${pin} and a commit:" >&2
            echo "$info" >&2
            exit 1
          fi
          found="$({ grep -aoE '/rustc/[0-9a-f]{40}[/\\]' "$MODULE" || true; } | cut -c8-47 | sort -u)"
          if [ -z "$found" ]; then
            echo "::error::${MODULE} holds no /rustc/<commit>/ path" >&2
            exit 1
          fi
          if [ "$found" != "$commit" ]; then
            echo "::error::${MODULE} names rustc $(tr '\n' ' ' <<<"$found"), not the pinned ${pin} (${commit})" >&2
            exit 1
          fi
          echo "${MODULE} was built by rustc ${pin} (${commit})"

      # Fails when the module asks for a glibc version newer than the floor,
      # VS Code's own, below which it would not load on RHEL 8, Ubuntu 20.04 or
      # Debian 11 (#1866). Runs on a dry run too. The checker's self-test runs
      # first, so a checker that stopped reading objdump's output cannot pass
      # every module.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        env:
          GLIBC_FLOOR: '2.28'
        run: |
          set -euo pipefail
          (cd tools && python3 test_check_glibc_floor.py)
          python3 tools/check_glibc_floor.py --floor "$GLIBC_FLOOR" extension/bin/${{ matrix.artifact }}

      # Fails when the module records a newer oldest macOS (its `minos`) than
      # VS Code 1.85 runs on: 10.15 for x86_64, 11.0 for arm64 (#1904). The
      # floors live in the checker. smoke-native loads the modules only on
      # recent macOS, so it cannot see this. The self-test runs first, as for
      # the glibc floor, and both use only the runner's own Python.
      - name: Check the macOS floor
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          (cd tools && python3 test_check_macos_floor.py)
          python3 tools/check_macos_floor.py extension/bin/${{ matrix.artifact }}

      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.vsce_target }}
          path: extension/bin/${{ matrix.artifact }}
          if-no-files-found: error

  # Loads each built module on its own target's hardware and decodes one
  # committed fixture per format, checked against the oracle files the Rust
  # tests use (#1868). `build-native` cross-compiles three targets, and no
  # other workflow runs on Windows, macOS or arm64 Linux, so without this five
  # of the six shipped modules would never be loaded before they publish.
  # `extension/scripts/smoke-native.cjs` also fails if the runner's Node is
  # not the module's platform and arch, so an emulated run cannot pass. It
  # runs on a dry run too, and every publishing job waits for it.
  #
  # On Linux it then loads the module from the packaged `.vsix` in a glibc 2.28
  # container (#1866), so it waits for `package` as well.
  smoke-native:
    name: Smoke test native (${{ matrix.vsce_target }})
    needs: [build-native, package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: fieldglass.linux-x64-gnu.node
            vsce_target: linux-x64
          - os: ubuntu-24.04-arm
            artifact: fieldglass.linux-arm64-gnu.node
            vsce_target: linux-arm64
          - os: windows-2025-vs2026
            artifact: fieldglass.win32-x64-msvc.node
            vsce_target: win32-x64
          - os: windows-11-arm
            artifact: fieldglass.win32-arm64-msvc.node
            vsce_target: win32-arm64
          - os: macos-15-intel
            artifact: fieldglass.darwin-x64.node
            vsce_target: darwin-x64
          - os: macos-26
            artifact: fieldglass.darwin-arm64.node
            vsce_target: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download native artifact for this target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.vsce_target }}
          path: extension/bin

      - name: Load the module and decode every format
        run: node extension/scripts/smoke-native.cjs extension/bin/${{ matrix.artifact }}

      - name: Download the .vsix for this target
        if: runner.os == 'Linux'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: vsix

      # The same checks on the module inside the `.vsix` a user installs, on
      # the oldest glibc the extension supports: Rocky Linux 8.10 has glibc
      # 2.28, as RHEL 8 does. The runner's Node runs in the container, since
      # Node's own Linux builds also need only 2.28. LD_BIND_NOW makes the
      # loader resolve every symbol when the module opens, not at first call.
      - name: Load the packaged module on glibc 2.28
        if: runner.os == 'Linux'
        env:
          FLOOR_IMAGE: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsix=(vsix/*.vsix)
          if [ "${#vsix[@]}" -ne 1 ]; then
            echo "::error::expected one .vsix, found ${#vsix[@]}"
            exit 1
          fi
          unzip -q "${vsix[0]}" "extension/bin/${ARTIFACT}" -d floor
          node_dir="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          docker run --rm --network none -e LD_BIND_NOW=1 -e ARTIFACT \
            -v "${node_dir}:/opt/node:ro" -v "${GITHUB_WORKSPACE}:/w:ro" -w /w \
            "$FLOOR_IMAGE" bash -c '
              set -euo pipefail
              glibc="$(getconf GNU_LIBC_VERSION)"
              if [ "$glibc" != "glibc 2.28" ]; then
                echo "::error::the container has $glibc, not glibc 2.28"
                exit 1
              fi
              /opt/node/bin/node extension/scripts/smoke-native.cjs "floor/extension/bin/${ARTIFACT}"
            '

  package:
    name: Package .vsix (${{ matrix.vsce_target }})
    needs: [build-native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vsce_target:
          - linux-x64
          - linux-arm64
          - win32-x64
          - win32-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Download native artifact for this target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.vsce_target }}
          path: extension/bin

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      # The same vsce the `publish` job uses.
      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Package extension (--target ${{ matrix.vsce_target }})
        run: |
          mkdir -p ${{ github.workspace }}/dist
          vsce package \
            --target ${{ matrix.vsce_target }} \
            --no-dependencies \
            --out ${{ github.workspace }}/dist/
        working-directory: extension

      # The license texts and NOTICE are what the Apache-2.0 and MIT terms ask
      # a copy of the extension to carry (#1578). `vsce package` above has
      # already copied the license files in (`vscode:prepublish`), so this
      # lists what the .vsix will hold.
      - name: Check the license files are in the .vsix
        run: |
          set -euo pipefail
          listing="$(vsce ls --no-dependencies)"
          for file in LICENSE-APACHE LICENSE-MIT NOTICE; do
            if ! grep -qxF "$file" <<<"$listing"; then
              echo "::error::$file is missing from the packaged extension"
              exit 1
            fi
          done
        working-directory: extension

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: dist/*.vsix
          if-no-files-found: error

  # Opens and draws one file of every format in VS Code, with the extension
  # loaded from the unzipped linux-x64 `.vsix` rather than the checkout (#1869).
  # The ci.yml Electron suite runs the development layout, which also holds
  # what `.vscodeignore` leaves out of the package, and builds its own native
  # module. So a runtime file the package drops would pass every other test;
  # `electron-suite` below runs the release-built module, but from the
  # checkout.
  # The checkout here has no native module of its own, so the package's is the
  # only one the test host can load. It runs on a dry run too, and every
  # publishing job waits for it.
  #
  # On VS Code 1.85.0, the `engines.vscode` floor, as well as the latest
  # release (#1877). `FIELDGLASS_VSCODE_VERSION` picks the build, and the
  # Mocha entry fails if the host is not that exact version.
  smoke-vsix:
    name: Smoke test the packaged extension (linux-x64, VS Code ${{ matrix.vscode }})
    needs: [package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # For the test runner and the compiled tests only. Nothing the extension
      # runs comes from this build: the test host loads it from the package.
      - name: Install extension dependencies and compile the tests
        run: |
          npm ci
          npm run compile
        working-directory: extension

      # mocha 12, the repo's, needs Node 20.19; VS Code 1.85 runs extensions
      # on Node 18.15, where it cannot load. So the floor run swaps in mocha
      # 11.8.0, the version the suite was proven on, for this run only,
      # leaving package.json and the lockfile as they are (owner decision on
      # #1877, 2026-11-19), and fails unless that is the one installed.
      - name: Use mocha 11 on VS Code 1.85
        if: matrix.vscode == '1.85.0'
        run: |
          set -euo pipefail
          npm install --no-save mocha@11.8.0
          version="$(node -p 'require("./node_modules/mocha/package.json").version')"
          if [ "$version" != 11.8.0 ]; then
            echo "::error::mocha ${version} is installed, not mocha 11.8.0" >&2
            exit 1
          fi
          echo "Testing with mocha ${version}"
        working-directory: extension

      - name: Download the linux-x64 .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-linux-x64
          path: vsix

      - name: Unzip the .vsix
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsix=(vsix/*.vsix)
          if [ "${#vsix[@]}" -ne 1 ]; then
            echo "::error::expected one .vsix, found ${#vsix[@]}"
            exit 1
          fi
          if compgen -G 'extension/bin/*.node' >/dev/null; then
            echo "::error::the checkout has a native module, which the test could load instead of the package's"
            exit 1
          fi
          unzip -q "${vsix[0]}" -d packaged

      - name: Open and draw every format from the package (under xvfb)
        env:
          FIELDGLASS_VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a node out/test/runPackagedTest.js "${GITHUB_WORKSPACE}/packaged"
        working-directory: extension

  # The whole Electron suite on the release-built linux-x64 module, on VS Code
  # 1.85.0, the `engines.vscode` floor, and on the latest release (#1877).
  # ci.yml runs it on every PR, but on the latest VS Code only and with a
  # module it builds itself. Once per release run, not per PR (owner decision,
  # 2026-11-17). It runs on a dry run too, and every publishing job waits for
  # it.
  electron-suite:
    name: Electron suite (VS Code ${{ matrix.vscode }})
    needs: [build-native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Download the linux-x64 native module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: extension/bin

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      # mocha 12, the repo's, needs Node 20.19; VS Code 1.85 runs extensions
      # on Node 18.15, where it cannot load. So the floor run swaps in mocha
      # 11.8.0, the version the suite was proven on, for this run only,
      # leaving package.json and the lockfile as they are (owner decision on
      # #1877, 2026-11-19), and fails unless that is the one installed.
      - name: Use mocha 11 on VS Code 1.85
        if: matrix.vscode == '1.85.0'
        run: |
          set -euo pipefail
          npm install --no-save mocha@11.8.0
          version="$(node -p 'require("./node_modules/mocha/package.json").version')"
          if [ "$version" != 11.8.0 ]; then
            echo "::error::mocha ${version} is installed, not mocha 11.8.0" >&2
            exit 1
          fi
          echo "Testing with mocha ${version}"
        working-directory: extension

      - name: Run the extension tests (under xvfb)
        env:
          FIELDGLASS_VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm test
        working-directory: extension

  # Runs before anything is published, and on a dry run too (#858). The
  # Release action cuts a body at 124,999 characters without a warning, so an
  # oversized CHANGELOG section would ship as truncated notes, after the
  # Marketplace, crates.io and npm already hold the version. So every
  # publishing job waits for this one, and the GitHub Release body it checks is
  # the one the `publish` job uses.
  release-notes:
    name: Check release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a tag, the `## [X.Y.Z]` section, which must exist and match the
      # workspace version. On a dry run there is no tag, so it checks the
      # workspace version's section, which must exist, and `## [Unreleased]` if
      # it has content. Either way it fails at 125,000 characters or more.
      # `tools/release_notes.py` has the details.
      - name: Extract and check release notes
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/release_notes.py --tag "$GITHUB_REF_NAME" --out release-notes.md
          else
            python3 tools/release_notes.py --dry-run --out release-notes.md
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Checks that the stored Marketplace token can still publish for the
  # `fieldglass` publisher. It runs on a dry run too, so an expired token shows
  # up there rather than at the tag, and every publishing job waits for it: a
  # token that fails here stops the release before any registry has the
  # version, instead of after crates.io and npm already do.
  marketplace-token:
    name: Check Marketplace token
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Verify the token can publish for fieldglass
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce verify-pat fieldglass

  publish:
    name: Publish to Marketplace + GitHub Release
    needs: [release-pins, package, smoke-native, smoke-vsix, electron-suite, release-notes, marketplace-token]
    # A manual workflow_dispatch run (dry run) builds, packages and checks the
    # release notes; only pushed tags trigger the actual publish + release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download all .vsix artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      # The curated CHANGELOG section for this version, not GitHub's
      # auto-generated commit list. `release-notes` extracted and checked it.
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # Pinned: re-run safety rests on `--skip-duplicate` behaving as read in
      # this version's source (it matches on version and target platform).
      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      # `--skip-duplicate` makes a re-run safe (#858). vsce checks each
      # package's version and target platform against the Marketplace and skips
      # one that is already there, so a run that failed after publishing some
      # targets, or after all of them, carries on to the GitHub Release.
      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          args=()
          for vsix in dist/*.vsix; do
            args+=(--packagePath "$vsix")
          done
          vsce publish --skip-duplicate "${args[@]}"

      # Re-running this updates the existing Release and replaces its assets
      # (`overwrite_files` defaults to true), so it is safe to repeat.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.vsix
          prerelease: false
          body_path: release-notes.md

  publish-crates:
    name: Publish library crates to crates.io
    needs: [release-pins, package, smoke-native, smoke-vsix, electron-suite, release-notes, marketplace-token]
    # Every tag is a release, so every tag publishes the crates. A
    # workflow_dispatch dry run has no tag, so it skips this job and keeps its
    # no-side-effects property.
    #
    # Gated on `package` so the crates only go out if every native target built,
    # and on `release-notes` so they only go out if the GitHub Release can be
    # made: a version on crates.io cannot be taken back, only yanked.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived registry
      # token, so no long-lived crates.io secret is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Check the tag matches the workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "fieldglass-core") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${crate_version}" >&2
            exit 1
          fi
          echo "Publishing version ${crate_version}"

      # The pre-commit hook runs this on every change; here it guards the exact
      # tree being published, since a version on crates.io cannot be replaced
      # (#1545 shipped 0.6.0 without the license files).
      - name: Check every crate packs its license files
        run: python3 tools/check_crate_license_files.py

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the library crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Is this exact version already on crates.io? A release re-run after a
          # partial failure must skip what already went out — `cargo publish`
          # errors on an existing version, which would otherwise fail the job.
          # Queried against the sparse index, whose path layout is fixed by name
          # length (crates.io: 1, 2, 3/x, then xx/yy).
          published() {
            local name="$1" want="$2" path body
            case ${#name} in
              1) path="1/${name}" ;;
              2) path="2/${name}" ;;
              3) path="3/${name:0:1}/${name}" ;;
              *) path="${name:0:2}/${name:2:2}/${name}" ;;
            esac
            # A 404 means the crate has never been published, so neither has this
            # version. Any other failure is treated the same way: attempt the
            # publish and let cargo be the authority.
            body="$(curl -sfL "https://index.crates.io/${path}")" || return 1
            grep -q "\"vers\":\"${want}\"" <<<"$body"
          }

          # `fieldglass-aec` first, then `fieldglass-core`: every format crate
          # pins core with `=`, and `fieldglass-grib2` also pins aec, so they
          # cannot even be packaged until those are in the index. `cargo publish` waits for each upload to propagate before
          # returning, so the next crate in the list resolves the one before it.
          # `fieldglass-aec` leads for a second reason: its Trusted Publishing is
          # configured by hand after its first, manual publish (ADR-0012
          # decision 10), so if that was missed it fails here, before anything
          # else goes out.
          #
          # `fieldglass-zarr`, `fieldglass-fetchplan` and `fieldglass` follow, in
          # that order: zarr pins core, fetchplan pins zarr, and the umbrella pins
          # every crate before it, so it goes last. Each had a manual first
          # publish too (#851); a missed one fails here after the five ahead of
          # it are out, and a re-run skips those.
          for crate in fieldglass-aec fieldglass-core fieldglass-grib1 fieldglass-grib2 fieldglass-netcdf \
                       fieldglass-zarr fieldglass-fetchplan fieldglass; do
            if published "$crate" "$version"; then
              echo "${crate} ${version} is already on crates.io — skipping"
              continue
            fi
            echo "Publishing ${crate} ${version}"
            cargo publish -p "$crate"
          done

  publish-wasm-npm:
    name: Publish @fieldglass/wasm to npm
    # `release-notes` for the same reason as `publish-crates`: npm keeps a
    # version once it is published.
    needs: [release-pins, package, smoke-native, smoke-vsix, electron-suite, release-notes, marketplace-token]
    runs-on: ubuntu-24.04
    env:
      # Must match ci.yml's pin, which is what the bundle-size gate measures
      # against: a release built with a different optimizer is not the module
      # whose size the README records. `tools/check_binaryen_pin.py` keeps the
      # two files in step. The Rust pin is the workflow-wide RUSTUP_TOOLCHAIN.
      BINARYEN_VERSION: version_132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived npm
      # token, the same pattern `publish-crates` uses for crates.io, so no
      # long-lived npm secret is stored in the repo. npm generates the
      # provenance attestation automatically from it; `--provenance` is not
      # passed and is not needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rust-docs` holds the standard library's COPYRIGHT-library.html, which
      # pack.sh copies into the package.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rust-docs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Trusted Publishing needs npm 11.5.1 or later, and Node 22 ships an
      # older npm than that. Upgrading explicitly rather than relying on
      # whatever the runner image happens to carry, because the failure without
      # it is an authentication error at the last step of a release.
      - name: Install an npm that can publish with OIDC
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      - name: Read the resolved wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          set -euo pipefail
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                     | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)"
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          tarball="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${tarball}"
          echo "${BINARYEN_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar xzf "$tarball" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      # Runs on a workflow_dispatch too, which is what makes the dry run useful:
      # it produces the exact tarball a tag would publish, and the step after it
      # proves that tarball installs and decodes. Only the publish itself is
      # gated on the tag.
      - name: Build the package
        run: crates/fieldglass-wasm/pack.sh

      # Also checks the standard library's notice is in the tarball and is the
      # building toolchain's own, and that the rustc commit package.json records
      # is the one in the `/rustc/<commit>/` paths inside each `.wasm`.
      - name: Check it installs and decodes
        run: node crates/fieldglass-wasm/tests/node/package.mjs

      # The test above holds the package to the rustc that built it; this holds
      # that rustc to the pin.
      - name: Check the module was built by the pinned Rust
        run: |
          set -euo pipefail
          built="$(node -p 'require("./crates/fieldglass-wasm/pkg/npm/package.json").rustc.release')"
          if [ "$built" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error::the package was built by rustc ${built}, not the pinned ${RUSTUP_TOOLCHAIN}" >&2
            exit 1
          fi
          echo "Built by rustc ${built}"

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          packed="$(node -p 'require("./crates/fieldglass-wasm/pkg/npm/package.json").version')"
          if [ "$tag_version" != "$packed" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${packed}" >&2
            exit 1
          fi
          echo "Publishing @fieldglass/wasm ${packed}"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldglass-wasm-npm
          path: crates/fieldglass-wasm/pkg/npm/*.tgz
          if-no-files-found: error

      # Only on a tag, so a workflow_dispatch run keeps its no-side-effects
      # property — the same rule `publish-crates` follows.
      #
      # Re-running a release after a partial failure must not fail here on a
      # version that already went out, so an existing version is skipped rather
      # than published again. npm, unlike crates.io, answers this without
      # authentication.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "@fieldglass/wasm@${version}" version >/dev/null 2>&1; then
            echo "@fieldglass/wasm ${version} is already on npm — skipping"
            exit 0
          fi
          cd crates/fieldglass-wasm/pkg/npm
          npm publish
