name: Dependabot refresh

# Keeps armed Dependabot PRs mergeable. Without this they stall silently.
#
# Branch protection on master sets required_status_checks.strict, so a PR must
# be up to date with master before it can merge. Nothing keeps it that way:
# GitHub's auto-merge does not update an out-of-date branch, and Dependabot only
# rebases on its own weekly schedule. So dependabot-auto-merge.yml arms
# auto-merge, the next merge to master pushes the branch BEHIND, and the PR sits
# green and unmerged until someone notices. Five sat that way for six days.
#
# The failure is invisible from the usual angle: every check is green and
# auto-merge is on. Only mergeStateStatus says BEHIND.
#
# So ask Dependabot to rebase the next PR that is waiting on nothing else.
#
# Why `@dependabot rebase` rather than the update-branch API: GITHUB_TOKEN
# cannot create a commit that touches .github/workflows, which is most of what
# Dependabot bumps here, so an API-side update would fail on exactly the PRs
# this is meant to unstick. Dependabot rebases with its own credentials.
#
# Why a schedule and not just `push` to master: a push made with GITHUB_TOKEN
# does not trigger workflows, and an auto-merge armed by dependabot-auto-merge.yml
# merges as GITHUB_TOKEN. Those merges are precisely the ones that re-stale the
# rest of the queue, and they land without firing anything (verified: the
# auto-merged commits 0d44395 and a448227 produced no master workflow runs at
# all, while PAT-merged commits on the same day produced four each). A push-only
# trigger would therefore go quiet exactly when it is needed. `push` is kept
# anyway so a human merge refreshes the queue immediately; the schedule is the
# backstop that covers auto-merges.

on:
  schedule:
    # Every 30 minutes — one PR is refreshed per run, so a weekly wave of five
    # drains in a couple of hours rather than sitting until someone looks.
    - cron: '*/30 * * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    name: Rebase the next stale Dependabot PR
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only PRs that already have auto-merge enabled are touched. Those
          # merge on their own once current, so a rebase finishes the job.
          # Bumps deliberately held for human review (see
          # dependabot-auto-merge.yml) are left alone rather than rebuilding a
          # branch every half hour; whoever reviews them updates it then.
          filter='[ .[]
                    | select(.author.login == "app/dependabot")
                    | select(.autoMergeRequest != null)
                    | select(.mergeStateStatus == "BEHIND") ]
                  | sort_by(.createdAt) | .[0].number // empty'

          # mergeStateStatus is computed lazily, and the first read after a push
          # is usually UNKNOWN. Reading it is what schedules the computation, so
          # re-read until no candidate is still UNKNOWN — otherwise a stale PR
          # reads as "not behind" and the stall this workflow exists to fix
          # survives it.
          for _ in $(seq 1 6); do
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
                    --json number,author,mergeStateStatus,autoMergeRequest,createdAt)

            unknown=$(printf '%s' "$prs" | jq '[ .[]
              | select(.author.login == "app/dependabot")
              | select(.autoMergeRequest != null)
              | select(.mergeStateStatus == "UNKNOWN") ] | length')

            if [ "$unknown" -eq 0 ]; then
              break
            fi
            echo "$unknown Dependabot PR(s) still computing mergeability; retrying."
            sleep 10
          done

          pr=$(printf '%s' "$prs" | jq -r "$filter")

          if [ -z "$pr" ]; then
            echo "No out-of-date Dependabot PRs are waiting on auto-merge."
            exit 0
          fi

          # Don't re-ask while a previous request is still outstanding. Dependabot
          # cannot always comply — a lockfile conflict needs a human — and
          # without this the schedule would comment on that PR every 30 minutes
          # forever. Re-asking is still allowed once the request has gone stale,
          # so a request that was simply dropped is retried.
          cutoff=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          asked=$(gh pr view "$pr" --repo "$REPO" --json comments \
                    | jq --arg cutoff "$cutoff" '[ .comments[]
                        | select(.body == "@dependabot rebase")
                        | select(.createdAt > $cutoff) ] | length')

          if [ "$asked" -gt 0 ]; then
            echo "#$pr already has a rebase request from the last 2h; leaving it."
            exit 0
          fi

          # One PR per run on purpose. Only one can merge against a given master
          # anyway, and merging re-stales the rest, so draining one at a time
          # costs one CI run per PR instead of rebuilding every branch each time.
          echo "Asking Dependabot to rebase #$pr."
          gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
