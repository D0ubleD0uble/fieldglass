name: Coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # Required so codecov-action can mint an OIDC token for tokenless upload.
  id-token: write

jobs:
  rust-coverage:
    name: Rust coverage (cargo llvm-cov → Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          # OIDC is issued for trusted runs (push, same-repo PRs); forked PRs
          # fall back to Codecov's tokenless heuristic, which can refuse the
          # upload. Keep fail_ci_if_error off so a forked-PR coverage failure
          # doesn't block contributors.
          use_oidc: true
          fail_ci_if_error: false
