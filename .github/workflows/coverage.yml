name: Coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # Required so codecov-action can mint an OIDC token for tokenless upload.
  id-token: write

jobs:
  rust-coverage:
    name: Rust coverage (cargo llvm-cov → Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: rust
          # OIDC is issued for trusted runs (push, same-repo PRs); forked PRs
          # fall back to Codecov's tokenless heuristic, which can refuse the
          # upload. Keep fail_ci_if_error off so a forked-PR coverage failure
          # doesn't block contributors.
          use_oidc: true
          fail_ci_if_error: false
