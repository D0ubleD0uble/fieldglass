name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    name: Lint + test via pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension deps (for tsc + npm audit hooks)
        run: npm ci
        working-directory: extension

      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny

      - name: Set up Python (for pre-commit)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (commit-stage hooks)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run pre-commit (push-stage hooks)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

      # A release tag publishes the library crates to crates.io, where a bad
      # manifest is only discovered at tag time — after the point where it is
      # cheap to fix. Packaging the one crate with no internal dependencies
      # catches the manifest regressions early: a missing `description`, a
      # `readme` that points at nothing, a file the package would omit.
      #
      # Only `fieldglass-core` can be checked this way today. The format crates
      # pin it with `=`, so cargo cannot resolve them for packaging until core
      # is on crates.io; once it is, they can be added here.
      - name: Check the published crate manifest
        run: cargo publish --dry-run -p fieldglass-core

  wasm:
    name: wasm32 build, bundle size, decode benchmark
    runs-on: ubuntu-latest
    env:
      # binaryen ships `wasm-opt`, which is not in taiki-e/install-action's
      # manifest, so it is fetched from GitHub Releases and checksummed here.
      # Pinned: `-Oz` output feeds the size gate, and a floating optimiser would
      # move the recorded figures on an unrelated commit.
      BINARYEN_VERSION: version_132
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          # `wasm32-wasip1` is the *test* target: same 32-bit pointer width as
          # the browser build, plus the stdio and file access libtest and the
          # fixture-reading tests need. `wasm32-unknown-unknown` has neither, so
          # it can only be checked, never run.
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The wasm-bindgen CLI has to be the exact version the build resolves or
      # the glue does not match the module's ABI, so the version comes out of
      # Cargo.lock rather than being written twice. build.sh checks the same
      # thing and fails loudly, but reading the lock means a Dependabot bump of
      # the crate does not need a matching edit here.
      - name: Read the resolved wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock \
                     | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)"
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install binaryen (wasm-opt)
        run: |
          tarball="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${tarball}"
          echo "${BINARYEN_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar xzf "$tarball" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      # The build status the milestone is actually asking for: the format crates
      # and the façade compile for the browser. A `--workspace` check cannot say
      # this, because fieldglass-napi does not build for wasm32 at all.
      - name: cargo check --target wasm32-unknown-unknown
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p fieldglass-core -p fieldglass-grib1 -p fieldglass-grib2 \
            -p fieldglass-netcdf -p fieldglass-wasm

      # The decode suites run where `usize` is 32 bits wide. A check proves the
      # crates compile for the browser; only this proves they *decode* the same
      # there, which is what the pointer-width cast audit (#561) turns on: a
      # `u64` length narrowed with a bare `as usize` wraps on this target, and
      # the wrapped value passes the bounds check that follows it.
      #
      # `wasmtime` rather than Node's `node:wasi`: the latter segfaulted on a
      # runner after a test binary had already reported every test green, which
      # is exactly the failure mode a gate must not have.
      #
      # `--dir=.` is the package root cargo sets as the working directory, which
      # every fixture path here is relative to; `--dir=..` is for the umbrella
      # crate's tests, which read a sibling crate's fixtures.
      - name: Install wasmtime
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasmtime@27

      # Two skips, neither of them a decode result, and both about what WASI
      # cannot do rather than what it computes:
      #   * `detect::fs_tests` calls `std::env::temp_dir`, which WASI has no
      #     answer for.
      #   * `probing_an_empty_raster_answers_rather_than_panicking` asserts its
      #     own hazard with `catch_unwind`, and wasm32 aborts on panic rather
      #     than unwinding, so nothing can catch it.
      #
      # `the_planar_inverses_match_their_pre_extraction_recording` used to be a
      # third: it is bit-exact, and wasm32 links Rust's own `libm` rather than
      # the host's. It now recognises a foreign libm and stands aside for the
      # quantised golden beside it (#617, ADR-0009), so nothing here has to know
      # about it.
      - name: cargo test --target wasm32-wasip1 (32-bit pointer width)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=. --dir=..
        run: |
          cargo test --target wasm32-wasip1 \
            -p fieldglass-core -p fieldglass-grib1 -p fieldglass-grib2 \
            -p fieldglass-netcdf -p fieldglass \
            -- --skip detect::fs_tests \
               --skip probing_an_empty_raster_answers_rather_than_panicking

      # Grouped baseline-then-simd on purpose. `--simd` changes RUSTFLAGS, which
      # changes the fingerprint of every crate in the graph, so alternating the
      # two would compile the whole tree four times instead of twice. The `web`
      # and `nodejs` builds of one variant share their cargo artifact and differ
      # only in the wasm-bindgen glue.
      - name: Build the browser bundles
        run: |
          crates/fieldglass-wasm/build.sh web
          crates/fieldglass-wasm/build.sh nodejs
          crates/fieldglass-wasm/build.sh web --simd
          crates/fieldglass-wasm/build.sh nodejs --simd

      # Fails when either build drifts more than 5% from the figures in the
      # crate README, in either direction, so the documented size is the
      # measured size. Writes the table into the run summary.
      - name: Bundle-size gate
        run: |
          python3 tools/check_wasm_bundle_size.py \
            --build baseline=crates/fieldglass-wasm/pkg/web/fieldglass_wasm_bg.wasm \
            --build '+simd128=crates/fieldglass-wasm/pkg/web-simd/fieldglass_wasm_bg.wasm'

      - name: Native decode baseline
        run: |
          cargo run --release -q -p fieldglass --example bench_decode \
            > "$RUNNER_TEMP/native.json"
          cat "$RUNNER_TEMP/native.json"

      # Decodes the committed real-producer GRIB2 fixtures under Node, checks
      # every field against its eccodes oracle before timing it, and prints
      # milliseconds beside the native column. Not a threshold: the number is the
      # deliverable, and a per-run timing gate on a shared runner would be noise.
      - name: wasm decode benchmark
        run: |
          node crates/fieldglass-wasm/tests/node/bench.mjs \
            --native "$RUNNER_TEMP/native.json"
          node crates/fieldglass-wasm/tests/node/bench.mjs \
            --native "$RUNNER_TEMP/native.json" \
            --pkg crates/fieldglass-wasm/pkg/nodejs-simd --label '+simd128'

  build-extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install root deps (napi-rs CLI)
        run: npm ci

      - name: Install extension deps
        run: npm ci
        working-directory: extension

      - name: Compile TypeScript
        run: npm run compile
        working-directory: extension

      - name: Build native module
        run: npx napi build --platform --release --target x86_64-unknown-linux-gnu --output-dir ${{ github.workspace }}/extension/bin
        working-directory: crates/fieldglass-napi

      - name: Verify native artifact exists
        run: test -f extension/bin/fieldglass.linux-x64-gnu.node

      - name: Run extension tests (mocha + @vscode/test-electron, under xvfb)
        run: xvfb-run -a npm test
        working-directory: extension
