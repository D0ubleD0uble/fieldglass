name: Public API

# Fails when a pull request breaks the public API of a published crate,
# measured against the latest v* tag, or the tag named in tools/semver-baseline
# when that file exists. How to read a failure is in RELEASING.md ("When
# things break"); the policy is #1682.
#
# The job always starts, so it can be a required check: a required check that
# is skipped by `on.paths` blocks merge. The "Decide whether to run" step
# does the path filtering instead, and the expensive steps check its output.
#
# "Public API vs last tag" is a required check on master (since 2026-11-04).
# This workflow runs the PR's own copy of itself, so a PR could edit it to
# pass. semver-guard.yml, which runs the base branch's copy, fails any PR that
# touches this file or the settings it reads unless the PR carries the
# `semver-change` label (#1699).

on:
  push:
    branches: [master]
  pull_request:
    # `labeled` and `unlabeled` re-run the job when `breaking` is added, which
    # is what unblocks a change to tools/semver-release-type.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # The self-test of the guard and baseline logic. It has a job and runner of
  # its own, with no `needs:` link, because the test file is not guarded: run
  # inside the job below it could write $GITHUB_PATH or $GITHUB_ENV, or
  # rewrite tools/semver_ci.py on disk, before the check runs.
  semver-ci-selftest:
    name: semver_ci.py self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test tools/semver_ci.py
        run: python3 -I tools/test_semver_ci.py

  semver-checks:
    name: Public API vs last tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the baseline is a tag, and the PR filter below needs the
      # merge base with the target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            # Raising the release type loosens the check, so it is only for a
            # deliberate break, which carries the `breaking` label. Resetting
            # to `patch`, or leaving the value alone, needs no label. A file
            # missing on the base counts as `patch`.
            rank() { case "$1" in patch) echo 0 ;; minor) echo 1 ;; major) echo 2 ;; *) echo 9 ;; esac; }
            read_setting() { grep -v '^#' | tr -d '[:space:]' || true; }
            if grep -qx 'tools/semver-release-type' <<<"$changed"; then
              base_value=$(git show "$BASE_SHA:tools/semver-release-type" 2>/dev/null | read_setting || true)
              base_value=${base_value:-patch}
              new_value=$(git show "$HEAD_SHA:tools/semver-release-type" | read_setting || true)
              if [ "$(rank "$new_value")" -gt "$(rank "$base_value")" ] \
                && ! jq -e 'index("breaking")' <<<"$LABELS" >/dev/null; then
                echo "::error::This PR raises the release type in tools/semver-release-type from '$base_value' to '$new_value', which loosens the public API check. Only a PR that deliberately breaks the API, and carries the 'breaking' label, may do that. Add the label, or revert the change. See RELEASING.md."
                exit 1
              fi
            fi
            if ! grep -Eq '^(crates/|Cargo\.toml$|Cargo\.lock$|tools/semver-release-type$|tools/semver-baseline$|tools/semver_ci\.py$|\.github/workflows/semver\.yml$)' <<<"$changed"; then
              echo "No crate, manifest or semver setting changed; skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned with cargo-semver-checks below; bump the two together. Each
          # cargo-semver-checks release supports only a range of rustdoc JSON
          # formats, and `stable` moving past it breaks the job.
          toolchain: 1.99.1

      - name: Cache cargo build
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Prebuilt binary, pinned. 0.51.0 is the version the 0.6.1 audit used.
      - name: Install cargo-semver-checks
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-semver-checks@0.51.0

      # --release-type is explicit on purpose, and mapped. The tool applies it
      # literally, and on 0.x cargo treats a minor bump as the breaking one.
      # tools/semver-release-type holds the next Fieldglass release's bump
      # (patch, minor or major). While the workspace major is 0 it is passed
      # one step up: patch -> minor, minor -> major. So a patch release may
      # deprecate but not break, and a minor release may break. `major` is an
      # error on 0.x. From 1.0 on the value passes through unchanged.
      # RELEASING.md says when to change the file.
      #
      # The baseline is the latest vX.Y.Z tag. tools/semver-baseline, when
      # present, names another one: the last good tag, for the one patch that
      # fixes a shipped break (RELEASING.md "Breaking changes"). The script
      # refuses a file that does not name an existing vX.Y.Z tag, and prints
      # the baseline it chose.
      #
      # The PR's checkout must not be able to swap the tools this step runs.
      # `python3 -I` keeps tools/ off the module path, so a PR-added
      # tools/json.py is not imported. RUSTUP_TOOLCHAIN overrides a PR-added
      # rust-toolchain.toml, which could point rustup at a committed fake
      # cargo. cargo-semver-checks is called by its own binary name, not as
      # `cargo semver-checks`, because a PR-added .cargo/config.toml alias
      # would replace that subcommand (cargo only warns). What this cannot
      # stop: build scripts and proc macros in the PR's crates run inside this
      # step when the tool builds them, as in any build of PR code.
      #
      # Both runs happen even if the first fails, so one push reports every
      # break. There is no exception clause.
      - name: Check the public API against the last tag
        if: steps.gate.outputs.run == 'true'
        env:
          # Keep equal to the toolchain in "Set up Rust" above.
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -uo pipefail
          if ! baseline=$(python3 -I tools/semver_ci.py baseline); then
            exit 1
          fi
          setting=$(grep -v '^#' tools/semver-release-type | tr -d '[:space:]' || true)
          workspace_major=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fieldglass-core") | .version | split(".")[0]')
          if [ -z "$workspace_major" ]; then
            echo "::error::could not read the fieldglass-core version from cargo metadata"
            exit 1
          fi
          if [ "$workspace_major" = "0" ]; then
            case "$setting" in
              patch) release_type=minor ;;
              minor) release_type=major ;;
              *) echo "::error::tools/semver-release-type must be patch or minor while the workspace is 0.x, got '$setting'"; exit 1 ;;
            esac
          else
            case "$setting" in
              patch|minor|major) release_type=$setting ;;
              *) echo "::error::tools/semver-release-type must be patch, minor or major, got '$setting'"; exit 1 ;;
            esac
          fi
          echo "Baseline $baseline, next release $setting, cargo-semver-checks --release-type $release_type"
          rc=0
          for features in --default-features --all-features; do
            echo "=== cargo-semver-checks semver-checks $features"
            cargo-semver-checks semver-checks --workspace --baseline-rev "$baseline" \
              --release-type "$release_type" "$features" || rc=1
          done
          exit $rc
