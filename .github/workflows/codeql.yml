name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Mon 06:30 UTC.
    - cron: '30 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL on private repos requires GitHub Advanced Security. Skip
    # until the repo is public; the workflow flips itself on automatically
    # when visibility changes.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      # Do not extract `#[cfg(test)]` code. The Rust extractor evaluates cfg
      # gates at extraction, with `test` on by default; `-test` turns it off,
      # so a `#[cfg(test)] mod tests` is never emitted — no AST, no dataflow,
      # nothing in the SARIF. This is the maintainers' documented opt-out
      # (github/codeql#20771, PR #18347) and it is the same default every other
      # CodeQL language reaches through a test-file classifier, which Rust does
      # not yet have. Set as an env var because the action has no input for
      # extractor options and the config file cannot carry them.
      #
      # Why: `rust/cleartext-logging` treats any identifier containing
      # `latitude` or `longitude` as user geolocation (PII), and `assert!`
      # messages as a log sink. In a grid decoder that flagged sixty-nine test
      # assertions and nothing real. The rule stays on for production code —
      # ADR-0005 puts a remote seam on the roadmap, and that is where a logged
      # credential would eventually appear. See ADR-0008.
      #
      # The JavaScript job ignores this; only the Rust extractor reads it.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # CodeQL's Rust extractor uses cargo metadata directly and only
          # supports build-mode: none. autobuild is unsupported and the
          # CodeQL CLI rejects it at `database init` with exit code 2.
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
